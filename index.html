<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0D1114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>麦克·记账本</title>
<meta name="apple-mobile-web-app-title" content="麦克·记账本">
<style>
/* ============================================================
   麦克·记账本 MAC'S LEDGER — 编辑式私人财务账本
   设计语言：期刊排版 / 发丝线 / 衬线数字 / 黄铜强调 / 无卡片堆叠
   ============================================================ */
:root{
  --ink:#0D1114;
  --ink-2:#131A1E;
  --paper:#ECE7DB;
  --paper-2:#A5A9A2;
  --paper-3:#6E7570;
  --line:rgba(236,231,219,.13);
  --line-2:rgba(236,231,219,.26);
  --brass:#D8B45C;
  --brass-2:#F0D28A;
  --brass-soft:rgba(216,180,92,.12);
  --spend:#E8836B;
  --gain:#84B79B;
  --warn:#E0A24A;
  --serif:Georgia,"Times New Roman","Songti SC","STSong",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --nav-w:216px;
  color-scheme:dark;
}
body[data-theme="paper"]{
  --ink:#F4F0E7;
  --ink-2:#ECE6DA;
  --paper:#1B211F;
  --paper-2:#5B625D;
  --paper-3:#8B918A;
  --line:rgba(27,33,31,.14);
  --line-2:rgba(27,33,31,.30);
  --brass:#96701C;
  --brass-2:#7A5912;
  --brass-soft:rgba(150,112,28,.10);
  --spend:#BC4E37;
  --gain:#2C7653;
  --warn:#A9701B;
  color-scheme:light;
}
/* 纸色主题：黄铜实心底一律改用米白字，保证 WCAG 级可读性 */
body[data-theme="paper"] .fab,
body[data-theme="paper"] .btn.solid,
body[data-theme="paper"] .seg button.on{color:#F7F3EA}
body[data-theme="paper"] .toast{background:#1B211F;color:#F4F0E7}
body[data-theme="paper"] .toast.err{background:#BC4E37;color:#fff}
body[data-theme="paper"] .fab .plus{border-color:#F4F0E7}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);background:var(--ink);color:var(--paper);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  min-height:100vh;overflow-x:hidden;
}
/* 极淡纸纹 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.28;
  background-image:radial-gradient(circle at 18% 12%,rgba(216,180,92,.055),transparent 46%),
                   radial-gradient(circle at 82% 78%,rgba(132,183,155,.035),transparent 50%);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{outline:none}
button:active{transform:scale(.975)}
::selection{background:var(--brass);color:var(--ink)}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em}
.mono{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.muted{color:var(--paper-2)}
.faint{color:var(--paper-3)}
.brass{color:var(--brass)}
.spend{color:var(--spend)}
.gain{color:var(--gain)}
.hair{height:1px;background:var(--line);border:0}

/* ===== 导航 ===== */
.nav{
  position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);z-index:30;
  border-right:1px solid var(--line);background:var(--ink);
  display:flex;flex-direction:column;padding:26px 18px 20px;
}
.nav-head{padding:0 8px 22px;border-bottom:1px solid var(--line);margin-bottom:18px}
.nav-mark{font-family:var(--serif);font-size:19px;line-height:1.3;letter-spacing:.01em;white-space:nowrap}
.nav-mark em{font-style:normal;color:var(--brass)}
.nav-sub{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--paper-3);margin-top:9px}
.nav-items{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px;
  color:var(--paper-2);font-size:13.5px;text-align:left;border-radius:2px;
  transition:color .16s,background .16s;position:relative;
}
.nav-item svg{width:17px;height:17px;flex:none;stroke:currentColor;stroke-width:1.5;fill:none}
.nav-item:hover{color:var(--paper);background:var(--brass-soft)}
.nav-item.on{color:var(--brass-2)}
.nav-item.on::before{content:"";position:absolute;left:-18px;top:9px;bottom:9px;width:2px;background:var(--brass)}
.nav-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line);font-size:10.5px;color:var(--paper-3);line-height:1.7}
.fab{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;height:42px;margin-top:18px;background:var(--brass);color:#16130B;
  font-size:13.5px;font-weight:700;border-radius:2px;letter-spacing:.02em;
  transition:background .16s,transform .16s;order:99;flex:none;
}
.fab:hover{background:var(--brass-2)}
.fab .plus{font-size:19px;font-weight:400;line-height:1}
.fab-label{display:inline}

/* ===== 主区 ===== */
.main{margin-left:var(--nav-w);position:relative;z-index:1;padding:0 0 90px}
.wrap{max-width:980px;margin:0 auto;padding:0 40px}
.masthead{padding:34px 0 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.masthead-l .mono{color:var(--brass);display:block;margin-bottom:10px}
.masthead h1{font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:.01em;line-height:1.15}
.masthead .desc{font-size:12px;color:var(--paper-2);margin-top:7px}
.ym{display:inline-flex;align-items:center;gap:5px}
.ym select{
  background:transparent;border:1px solid var(--line-2);border-radius:2px;
  padding:7px 9px;font-size:12.5px;font-weight:600;color:var(--paper);cursor:pointer;
}
.ym select:hover{border-color:var(--brass)}

/* section 编辑式 */
.sec{padding:26px 0 28px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px}
.sec-title{display:flex;align-items:baseline;gap:12px}
.sec-no{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--brass)}
.sec-name{font-size:13px;font-weight:600;letter-spacing:.04em}
.sec-note{font-size:11px;color:var(--paper-3)}

/* 首页主数字 */
.hero{padding:38px 0 30px;border-bottom:1px solid var(--line)}
.hero .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--brass);margin-bottom:14px}
.hero-num{font-family:var(--serif);font-size:clamp(52px,9vw,92px);line-height:1.02;letter-spacing:-.035em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero-num .cur{font-size:.42em;color:var(--brass);letter-spacing:0}
.hero-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--paper-2)}
.delta{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:3px 8px;border:1px solid var(--line-2);border-radius:2px}
.delta.up{color:var(--spend)}.delta.down{color:var(--gain)}.delta.flat{color:var(--paper-3)}

/* 三栏数据（细线分隔，非卡片） */
.trio{display:grid;grid-template-columns:repeat(3,1fr)}
.trio>div{padding:4px 22px;border-left:1px solid var(--line)}
.trio>div:first-child{padding-left:0;border-left:0}
.trio .lbl{font-size:11px;color:var(--paper-2);margin-bottom:8px}
.trio .val{font-family:var(--serif);font-size:clamp(21px,3vw,29px);font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.trio .sub{font-size:10.5px;color:var(--paper-3);margin-top:7px}

/* 图表 */
.chart-box{position:relative;background:transparent}
.chart-box svg{display:block;width:100%;height:auto;overflow:visible}
.chart-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.chart-grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.chart-area{opacity:.13}
/* 数据点用 HTML 层绘制，避免 SVG 横向拉伸把圆点压成椭圆 */
.dot-layer{position:absolute;left:0;right:0;top:0;height:132px;pointer-events:none}
.dot-layer i{position:absolute;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%);border:1.5px solid var(--ink)}
.chart-hit{fill:transparent;cursor:pointer}
.chart-tip{
  position:absolute;top:0;left:50%;transform:translate(-50%,-6px);
  background:var(--ink-2);border:1px solid var(--line-2);padding:7px 12px;
  font-size:11.5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .16s;
  z-index:3;border-radius:2px;box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.chart-tip.show{opacity:1}
.chart-legend{display:flex;gap:18px;margin-top:12px;font-size:11px;color:var(--paper-2);flex-wrap:wrap}
.chart-legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
.chart-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--paper-3);margin-top:6px;font-family:var(--mono);letter-spacing:.04em}
.chart-axis span{flex:1;text-align:center}
.chart-axis span:first-child{text-align:left}.chart-axis span:last-child{text-align:right}

/* 条形占比 */
.bars{display:flex;flex-direction:column;gap:15px}
.bar-row{display:grid;grid-template-columns:88px 1fr 96px;align-items:center;gap:14px}
.bar-name{font-size:12.5px;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-emoji{font-size:14px}
.bar-track{height:5px;background:var(--line);position:relative;overflow:hidden}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:0;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.bar-val{text-align:right;font-family:var(--serif);font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-pct{display:block;font-family:var(--sans);font-size:10px;color:var(--paper-3)}

/* 预算 */
.budget-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.budget-num{font-family:var(--serif);font-size:26px;font-variant-numeric:tabular-nums}
.budget-track{height:7px;background:var(--line);position:relative;overflow:hidden}
.budget-track .f{position:absolute;left:0;top:0;bottom:0;background:var(--brass);transition:width .5s}
.budget-track .f.over{background:var(--spend)}
.budget-track .mark{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--line-2);left:80%}
.budget-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--paper-2);margin-top:9px}
.notice{margin-top:14px;padding:10px 13px;border-left:2px solid var(--brass);background:var(--brass-soft);font-size:12px;color:var(--paper-2);line-height:1.6}
.notice.warn{border-color:var(--spend);background:rgba(232,131,107,.09)}

/* 交易列表 */
.tx-day{padding:20px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line)}
.tx-day:first-child{padding-top:4px}
.tx-day .d{font-size:11.5px;color:var(--paper-2);font-family:var(--mono);letter-spacing:.06em}
.tx-day .s{font-size:11px;color:var(--paper-3);font-variant-numeric:tabular-nums}
.tx{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:13px 4px;border-bottom:1px solid var(--line);position:relative;
  transition:background .14s;padding-left:8px;
}
.tx:hover{background:var(--brass-soft)}
.tx::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:22px;background:var(--c,var(--line-2))}
.tx-ic{width:34px;height:34px;flex:none;display:grid;place-items:center;font-size:16px;border-radius:2px}
.tx-body{flex:1;min-width:0}
.tx-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tx-tag{font-size:10.5px;color:var(--paper-3);margin-top:2px;display:flex;gap:8px;white-space:nowrap;overflow:hidden}
.tx-tag .p{color:var(--brass)}
.tx-amt{font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.tx-del{position:absolute;right:0;top:50%;transform:translateY(-50%);width:30px;height:30px;color:var(--paper-3);opacity:0;font-size:15px;transition:opacity .15s,color .15s}
.tx:hover .tx-del{opacity:1}
.tx-del:hover{color:var(--spend)}
.tx:hover .tx-amt{margin-right:26px}
.link{font-size:11.5px;color:var(--brass);border-bottom:1px solid var(--brass);padding-bottom:2px;white-space:nowrap}
.link:hover{color:var(--brass-2)}

/* 空状态 */
.empty{padding:44px 16px;text-align:center;border:1px dashed var(--line);margin-top:6px}
.empty .glyph{font-family:var(--serif);font-size:38px;color:var(--line-2);line-height:1}
.empty .t{font-family:var(--serif);font-size:16px;margin-top:12px}
.empty .s{font-size:11.5px;color:var(--paper-3);margin-top:7px}

/* 筛选 */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px 0}
.filters select,.filters input[type=text],.filters input[type=search]{
  height:36px;padding:0 11px;background:transparent;border:1px solid var(--line-2);
  border-radius:2px;font-size:12.5px;color:var(--paper);
}
.filters select{cursor:pointer}
.filters .kw{flex:1;min-width:130px}
.filters input::placeholder{color:var(--paper-3)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:2px;overflow:hidden}
.seg button{padding:8px 14px;font-size:12px;color:var(--paper-2);transition:all .14s}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--brass);color:#16130B;font-weight:700}
.seg button:hover:not(.on){background:var(--brass-soft);color:var(--paper)}

/* 项目列表（编辑式，非卡片网格） */
.proj-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 4px;border-bottom:1px solid var(--line);position:relative;transition:background .14s}
.proj-row:hover{background:var(--brass-soft)}
.proj-ic{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:19px;border:1px solid var(--line-2);border-radius:2px}
.proj-main{flex:1;min-width:0}
.proj-nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-sub{font-size:11px;color:var(--paper-3);margin-top:3px}
.proj-amt{text-align:right;flex:none}
.proj-amt .v{font-family:var(--serif);font-size:18px;font-variant-numeric:tabular-nums}
.proj-amt .l{font-size:10px;color:var(--paper-3);display:block;margin-top:2px}
.proj-bar{height:3px;background:var(--line);margin-top:8px;position:relative}
.proj-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--brass)}
.proj-x{width:30px;height:30px;color:var(--paper-3);opacity:0;flex:none;font-size:15px}
.proj-row:hover .proj-x{opacity:1}
.proj-x:hover{color:var(--spend)}

/* 排行 / 列表 */
.rank-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.rank-no{font-family:var(--mono);font-size:11px;color:var(--brass);width:26px;flex:none}
.rank-nm{flex:1;font-size:12.5px}
.rank-v{font-family:var(--serif);font-size:15px;font-variant-numeric:tabular-nums}
.rank-mini{width:70px;height:3px;background:var(--line);position:relative;flex:none}
.rank-mini i{position:absolute;left:0;top:0;bottom:0;background:var(--brass)}

/* 设置表单 */
.form-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.form-row .lab{font-size:13px}
.form-row .hint{font-size:10.5px;color:var(--paper-3);margin-top:3px}
.inp{height:38px;padding:0 12px;background:transparent;border:1px solid var(--line-2);border-radius:2px;font-size:13px;min-width:0}
.inp:focus{border-color:var(--brass)}
.inp.num-inp{font-family:var(--serif);font-size:16px;text-align:right;width:130px}
.btn{padding:10px 16px;border:1px solid var(--line-2);border-radius:2px;font-size:12.5px;color:var(--paper);transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--brass);color:var(--brass)}
.btn.solid{background:var(--brass);border-color:var(--brass);color:#16130B;font-weight:700}
.btn.solid:hover{background:var(--brass-2);color:#16130B}
.btn.danger{color:var(--spend);border-color:rgba(232,131,107,.45)}
.btn.danger:hover{background:rgba(232,131,107,.1);border-color:var(--spend)}
.btn.sm{padding:7px 11px;font-size:11.5px}
.cat-manage{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cat-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line-2);border-radius:2px;font-size:12px}
.cat-chip button{color:var(--paper-3);font-size:13px;margin-left:2px}
.cat-chip button:hover{color:var(--spend)}
.stat-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--paper-2)}
.stat-line b{color:var(--paper);font-family:var(--serif);font-size:14px;font-weight:400}

/* ===== 抽屉 / 弹层 ===== */
.overlay{position:fixed;inset:0;background:rgba(4,7,9,.72);z-index:60;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.sheet{
  width:100%;max-width:440px;background:var(--ink-2);border:1px solid var(--line-2);
  border-radius:3px;max-height:92vh;overflow-y:auto;
  animation:sheetIn .24s cubic-bezier(.2,.8,.3,1);
}
@keyframes sheetIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-family:var(--serif);font-size:19px;font-weight:400}
.sheet-x{width:30px;height:30px;color:var(--paper-2);font-size:17px;border-radius:2px}
.sheet-x:hover{background:var(--brass-soft);color:var(--paper)}
.sheet-body{padding:20px 22px}
.sheet-foot{padding:0 22px 22px;display:flex;gap:10px}
.sheet-foot .btn{flex:1;justify-content:center;text-align:center;padding:13px}
.type-switch{display:flex;border-bottom:1px solid var(--line-2);margin-bottom:22px}
.type-switch button{flex:1;padding:11px 0;font-family:var(--serif);font-size:18px;color:var(--paper-3);position:relative;transition:color .16s}
.type-switch button.on{color:var(--paper)}
.type-switch button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brass)}
.type-switch button[data-t=expense].on{color:var(--spend)}
.type-switch button[data-t=income].on{color:var(--gain)}
.amt-wrap{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line-2);padding-bottom:10px;margin-bottom:22px}
.amt-wrap .cur{font-family:var(--serif);font-size:28px;color:var(--brass)}
.amt-wrap input{
  flex:1;min-width:0;background:none;border:none;font-family:var(--serif);
  font-size:clamp(38px,8vw,52px);font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  color:var(--paper);width:100%;
}
.amt-wrap input::placeholder{color:var(--line-2)}
.fld{margin-bottom:20px}
.fld>label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--paper-3);margin-bottom:10px;text-transform:uppercase}
.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.cat-scroll::-webkit-scrollbar{height:3px}
.cat-scroll::-webkit-scrollbar-thumb{background:var(--line-2)}
.cat-opt{
  flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;
  min-width:62px;padding:10px 8px;border:1px solid var(--line);border-radius:2px;
  font-size:11px;color:var(--paper-2);transition:all .14s;
}
.cat-opt .e{font-size:19px;line-height:1}
.cat-opt:hover{border-color:var(--line-2);color:var(--paper)}
.cat-opt.on{border-color:var(--brass);background:var(--brass-soft);color:var(--brass-2)}
.line2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.line2 .inp,.line2 select{width:100%}
.confirm-box{background:var(--ink-2);border:1px solid var(--line-2);border-radius:3px;max-width:380px;width:100%;padding:24px;animation:sheetIn .2s}
.confirm-box h3{font-family:var(--serif);font-size:19px;font-weight:400;margin-bottom:10px}

/* toast */

  position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
  background:var(--brass);color:#16130B;padding:11px 20px;border-radius:2px;

/* 弹层打开时提示移到顶部，避免遮挡底部保存按钮 */

/* 视图动效 */
.view{animation:viewIn .28s cubic-bezier(.2,.8,.3,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== 手机端（优先设计） ===== */
@media(max-width:860px){

  /* 记账按钮嵌入底部导航中央，彻底避免悬浮遮挡内容 */
  .fab{
    position:static;order:0;flex:1;width:auto;height:auto;margin:0;padding:0;
    background:transparent;box-shadow:none;border-radius:0;

  .fab .plus{

<body data-theme="ink">

<!-- ============ 导航 ============ -->
<nav class="nav">
  <div class="nav-head">
    <div class="nav-mark">麦克<em>·</em>记账本</div>
    <div class="nav-sub">MAC'S LEDGER · PRIVATE</div>
  </div>
  <div class="nav-items" id="navItems"></div>
  <div class="nav-foot">
    数据仅存于本机浏览器<br>不上传 · 不联网 · 可随时导出
  </div>
</nav>

<!-- ============ 主区 ============ -->
<main class="main"><div class="wrap" id="content"></div></main>

<!-- ============ 记账抽屉 ============ -->
<div class="overlay" id="txOverlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h3 id="txTitle">记一笔</h3>
      <button class="sheet-x" onclick="closeOverlay('txOverlay')" aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <div class="type-switch">
        <button data-t="expense" id="tsExp" class="on" onclick="setType('expense')">支出</button>
        <button data-t="income" id="tsInc" onclick="setType('income')">收入</button>
      </div>
      <div class="amt-wrap">
        <span class="cur">¥</span>
        <input type="text" inputmode="decimal" id="fAmount" placeholder="0.00" autocomplete="off" aria-label="金额">
      </div>
      <div class="fld">
        <label>分类 · Category</label>
        <div class="cat-scroll" id="catScroll"></div>
      </div>
      <div class="fld">
        <label>备注 · Note</label>
        <input type="text" class="inp" id="fNote" placeholder="选填，例如：午饭 / 地铁" style="width:100%">
      </div>
      <div class="line2 fld">
        <div>
          <label style="font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--paper-3);display:block;margin-bottom:10px">日期 · Date</label>
          <input type="date" class="inp" id="fDate">
        </div>
        <div id="projFieldWrap">
          <label style="font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--paper-3);display:block;margin-bottom:10px">项目 · Project</label>
          <select class="inp" id="fProject"></select>
        </div>
      </div>
    </div>
    <div class="sheet-foot" id="txFoot">
      <button class="btn solid" onclick="saveTx()">保存记录</button>
    </div>
  </div>
</div>

<!-- ============ 项目抽屉 ============ -->
<div class="overlay" id="projOverlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h3 id="projTitle">新建项目</h3>
      <button class="sheet-x" onclick="closeOverlay('projOverlay')" aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <div class="fld">
        <label>项目名称</label>
        <input type="text" class="inp" id="pName" placeholder="例如：四川旅行" style="width:100%">
      </div>
      <div class="fld">
        <label>图标</label>
        <div class="cat-scroll" id="pIconScroll"></div>
      </div>
      <div class="fld">
        <label>预算（选填）</label>
        <div class="amt-wrap" style="margin-bottom:0">
          <span class="cur" style="font-size:20px">¥</span>
          <input type="text" inputmode="decimal" id="pBudget" placeholder="0.00" style="font-size:28px">
        </div>
      </div>
    </div>
    <div class="sheet-foot" id="projFoot">
      <button class="btn solid" onclick="saveProject()">创建项目</button>
    </div>
  </div>
</div>

<!-- ============ 确认弹层 ============ -->
<div class="overlay center" id="confirmOverlay">
  <div class="confirm-box" role="alertdialog" aria-modal="true">
    <h3 id="cfTitle">确认操作</h3>
    <p id="cfMsg"></p>
    <div class="confirm-foot">
      <button class="btn" onclick="closeOverlay('confirmOverlay')">取消</button>
      <button class="btn danger" id="cfOk">确认</button>
    </div>
  </div>
</div>

<!-- ============ 导入弹层 ============ -->
<div class="overlay" id="importOverlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h3>导入备份数据</h3>
      <button class="sheet-x" onclick="closeOverlay('importOverlay')" aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <p style="font-size:12px;color:var(--paper-2);line-height:1.7;margin-bottom:14px">粘贴此前导出的 JSON 备份内容。导入采用<b style="color:var(--brass)">合并模式</b>：按记录 ID 去重，不会覆盖或删除现有账单。</p>
      <textarea class="inp" id="importText" rows="7" placeholder='{"version":1,"data":{"txs":[...],"projects":[...]}}' style="width:100%;height:auto;padding:12px;resize:vertical;font-family:var(--mono);font-size:11px;line-height:1.6"></textarea>
      <div style="margin-top:12px">
        <label class="btn sm" style="display:inline-block;cursor:pointer">或从文件导入
          <input type="file" id="importFile" accept=".json,application/json" style="display:none">
        </label>
      </div>
    </div>
    <div class="sheet-foot">
      <button class="btn solid" onclick="doImport()">合并导入</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   0. 数据契约 —— 与旧版完全兼容，零迁移
   LS_KEY = 'ledger_data_v1'
   db = { txs:[{id,type,amount,cat,note,date,project,createdAt}],
          projects:[{id,name,emoji,color,budget}] }
   任何情况下不改写字段、不删除键、不清空存储。
   ============================================================ */
const LS_KEY       = 'ledger_data_v1';       // 主数据：原样保留
const SETTINGS_KEY = 'ledger_settings_v1';   // 新设置：独立键
const SNAPSHOT_KEY = 'ledger_snapshot_v1';   // 一次性原始快照（永不覆盖）
const BACKUP_KEY   = 'ledger_backup_v1';     // 写入前的上一版本（可回滚）
const MIRROR_KEY   = 'ledger_mirror_v1';     // 与最后一次成功写入同步的完整镜像

const DEFAULT_CATS = {
  expense:[
    {name:'餐饮',emoji:'🍜',color:'#E8836B'},
    {name:'交通',emoji:'🚗',color:'#7FA6D9'},
    {name:'购物',emoji:'🛍️',color:'#D18BAE'},
    {name:'居住',emoji:'🏠',color:'#A89BD1'},
    {name:'娱乐',emoji:'🎮',color:'#7CBCC4'},
    {name:'医疗',emoji:'💊',color:'#D97A7A'},
    {name:'教育',emoji:'📚',color:'#8FB79A'},
    {name:'其他',emoji:'📦',color:'#9AA098'}
  ],
  income:[
    {name:'工资',emoji:'💼',color:'#84B79B'},
    {name:'奖金',emoji:'🎁',color:'#D8B45C'},
    {name:'理财',emoji:'📈',color:'#7FB89E'},
    {name:'其他',emoji:'💰',color:'#A9BE6A'}
  ]
};
const PROJECT_PRESETS = [
  {emoji:'✈️',color:'#7FA6D9',label:'旅游'},
  {emoji:'🤖',color:'#A89BD1',label:'AI 充值'},
  {emoji:'🎮',color:'#7CBCC4',label:'游戏'},
  {emoji:'👔',color:'#D18BAE',label:'服装'},
  {emoji:'🏡',color:'#8FB79A',label:'家装'},
  {emoji:'🎓',color:'#D8B45C',label:'学习'},
  {emoji:'🎁',color:'#E8836B',label:'礼金'},
  {emoji:'📦',color:'#9AA098',label:'其他'}
];
const NAV = [
  {id:'overview',label:'总览',icon:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>'},
  {id:'ledger',  label:'账单',icon:'<path d="M4 6h16M4 12h16M4 18h10"/>'},
  {id:'insights',label:'分析',icon:'<path d="M4 18V9M9 18V5M14 18v-7M19 18v-4"/>'},
  {id:'projects',label:'项目',icon:'<path d="M4 8h6l2 2h8v9H4z"/>'},
  {id:'settings',label:'设置',icon:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>'}
];
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];

/* ---------- 读取：多重保护，绝不静默丢数据 ---------- */
function safeParse(s){
  try{return JSON.parse(s)}catch(e){return null}
}
function load(){
  const raw = localStorage.getItem(LS_KEY);
  // 首次启动：把当前（改造前）主数据原封不动存为一次性快照
  if(raw && !localStorage.getItem(SNAPSHOT_KEY)){
    try{localStorage.setItem(SNAPSHOT_KEY, raw)}catch(e){}
  }
  if(raw){
    const o = safeParse(raw);
    if(o && Array.isArray(o.txs)){
      if(!Array.isArray(o.projects)) o.projects = [];   // 兼容早期无 projects 的数据
      try{if(!localStorage.getItem(MIRROR_KEY))localStorage.setItem(MIRROR_KEY,JSON.stringify(o))}catch(e){}
      return o;
    }
    // 主数据损坏 → 依次尝试同步镜像 / 上一版本 / 原始快照
    const mi=localStorage.getItem(MIRROR_KEY),bk=localStorage.getItem(BACKUP_KEY),sn=localStorage.getItem(SNAPSHOT_KEY);
    for(const s of [mi,bk,sn]){
      const b = s && safeParse(s);
      if(b && Array.isArray(b.txs)){
        if(!Array.isArray(b.projects)) b.projects = [];
        try{localStorage.setItem(LS_KEY, JSON.stringify(b))}catch(e){}
        setTimeout(()=>toast('已从备份恢复账目'),600);
        return b;
      }
    }
    // 三者都不可用：保留原始字符串，绝不以空对象覆盖
    console.error('[麦克·记账本] 主数据无法解析，已保留原始内容，未做覆盖');
    return {txs:[],projects:[],__parseError:true};
  }
  return {txs:[],projects:[]};
}
function persist(){
  try{
    const prev = localStorage.getItem(LS_KEY);
    if(prev) localStorage.setItem(BACKUP_KEY, prev);      // 写入前保留上一版
  }catch(e){}
  try{
    if(db.__parseError){                                  // 解析异常时不覆盖原始字符串
      toast('数据异常：已停止写入以保护原账单',true); return;
    }
    const text=JSON.stringify(db);
    localStorage.setItem(LS_KEY,text);
    try{localStorage.setItem(MIRROR_KEY,text)}catch(e){}  // 同步镜像，损坏时可零丢失恢复
  }catch(e){ toast('保存失败：浏览器存储空间不足',true); }
}
function defaultSettings(){
  return {monthlyBudget:0,catBudgets:{},customCats:{expense:[],income:[]},hiddenCats:{expense:[],income:[]},lastCat:{expense:null,income:null},theme:'ink'};
}
function loadSettings(){
  const s = safeParse(localStorage.getItem(SETTINGS_KEY));
  const d = defaultSettings();
  if(!s || typeof s!=='object') return d;
  return Object.assign(d,s,{
    catBudgets:s.catBudgets||{},
    customCats:Object.assign(d.customCats,s.customCats||{}),
    hiddenCats:Object.assign(d.hiddenCats,s.hiddenCats||{}),
    lastCat:Object.assign(d.lastCat,s.lastCat||{})
  });
}
function saveSettings(){
  try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}catch(e){toast('设置保存失败',true)}
}

let settings = loadSettings();
let db = load();

/* ============================================================
   1. 状态与工具
   ============================================================ */
let view='overview';
let filterMonth=currentMonth();
let filterType='all', filterCat='all', filterKw='';
let activeProject=null;
let txForm={type:'expense',cat:null,project:null,editing:null};
let projForm={emoji:'✈️',color:'#7FA6D9',editing:null};
let chartData={trend:[],balance:[]};
let confirmCb=null;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function currentMonth(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function ymOf(date){return String(date||'').slice(0,7)}
function inMonth(t,ym){return ymOf(t.date)===ym}
function shiftYM(ym,delta){
  const [y,m]=ym.split('-').map(Number);
  const d=new Date(y,m-1+delta,1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function recentMonths(ym,n){
  const a=[];for(let i=n-1;i>=0;i--)a.push(shiftYM(ym,-i));return a;
}
function monthLabel(ym){const [y,m]=ym.split('-');return `${y}年${Number(m)}月`}
function shortMonth(ym){return Number(ym.split('-')[1])+'月'}
function dayLabel(d){
  const p=String(d||'').split('-');
  if(p.length<3)return d||'';
  const w=WEEK[new Date(d+'T00:00:00').getDay()]||'';
  return `${Number(p[1])}月${Number(p[2])}日 · ${w}`;
}
function num(n){return (Number(n)||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function yuan(n){return '¥'+num(n)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sum(list){return list.reduce((s,t)=>s+Number(t.amount||0),0)}
function getCats(type){
  const hidden=settings.hiddenCats[type]||[];
  const custom=settings.customCats[type]||[];
  return DEFAULT_CATS[type].concat(custom).filter(c=>!hidden.includes(c.name));
}
function findCat(type,name){
  return DEFAULT_CATS[type].concat(settings.customCats[type]||[]).find(c=>c.name===name)
      || {name:name||'其他',emoji:'📦',color:'#9AA098'};
}
function findProject(id){return db.projects.find(p=>p.id===id)}
function monthStats(ym){
  const l=db.txs.filter(t=>inMonth(t,ym));
  const exp=sum(l.filter(t=>t.type==='expense'));
  const inc=sum(l.filter(t=>t.type==='income'));
  return {list:l,exp:exp,inc:inc,bal:inc-exp,count:l.length};
}
function totalBalance(){
  const inc=sum(db.txs.filter(t=>t.type==='income'));
  const exp=sum(db.txs.filter(t=>t.type==='expense'));
  return inc-exp;
}
function pctChange(cur,prev){
  if(prev===0)return null;                       // 无同期基数，不计算百分比
  return (cur-prev)/Math.abs(prev)*100;
}
function deltaHtml(cur,prev,label){
  const pre=label?label+' ':'';
  if(prev>0&&cur<0)return `<span class="delta up">${pre}由盈转亏</span>`;
  if(prev<0&&cur>0)return `<span class="delta down">${pre}扭亏为盈</span>`;
  const p=pctChange(cur,prev);
  if(p===null)return `<span class="delta flat">${label?label+' 无同期数据':'新增'}</span>`;
  if(Math.abs(p)<0.5)return `<span class="delta flat">${pre}持平</span>`;
  return `<span class="delta ${p>0?'up':'down'}">${p>0?'↑':'↓'} ${pre}${Math.abs(p).toFixed(0)}%</span>`;
}
function toast(msg,err){
  const t=document.getElementById('toast');
  const top=!!document.querySelector('.overlay.show');
  t.textContent=msg;t.className='toast show'+(err?' err':'')+(top?' top':'');
  clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2200);
}
function confirmDo(title,msg,cb,okText){
  document.getElementById('cfTitle').textContent=title;
  document.getElementById('cfMsg').innerHTML=msg;
  const btn=document.getElementById('cfOk');
  btn.textContent=okText||'确认';
  confirmCb=cb;
  document.getElementById('confirmOverlay').classList.add('show');
}
document.getElementById('cfOk').addEventListener('click',()=>{
  closeOverlay('confirmOverlay');
  if(confirmCb){const f=confirmCb;confirmCb=null;f()}
});
function openOverlay(id){document.getElementById(id).classList.add('show')}
function closeOverlay(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('.overlay').forEach(o=>{
  o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show')});
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')document.querySelectorAll('.overlay.show').forEach(o=>o.classList.remove('show'));
});

/* ============================================================
   2. 导航与渲染入口
   ============================================================ */
function renderNav(){
  const items=NAV.map(n=>`
    <button class="nav-item ${view===n.id?'on':''}" onclick="go('${n.id}')">
      <svg viewBox="0 0 24 24">${n.icon}</svg><span>${n.label}</span>
    </button>`);
  const fab=`<button class="fab" onclick="openTx()" aria-label="记一笔"><span class="plus">+</span><span class="fab-label">记一笔</span></button>`;
  // 手机端位于底部导航中央（DOM 顺序）；桌面端由 CSS order:99 置于列表末尾
  document.getElementById('navItems').innerHTML=items.slice(0,2).join('')+fab+items.slice(2).join('');
}
function go(v){
  view=v;activeProject=null;
  renderNav();render();
  window.scrollTo({top:0,behavior:'instant'});
}
function setTheme(t){
  settings.theme=t;saveSettings();
  document.body.dataset.theme=t;
  document.querySelector('meta[name=theme-color]').content = t==='paper'?'#F4F0E7':'#0D1114';
}
function render(){
  renderNav();
  const c=document.getElementById('content');
  const map={overview:renderOverview,ledger:renderLedger,insights:renderInsights,projects:renderProjects,settings:renderSettings};
  c.innerHTML=`<div class="view">${map[view]()}</div>`;
  if(view==='insights')bindChartTips();
}
function masthead(title,desc,right){
  return `<div class="masthead">
    <div class="masthead-l">
      <span class="mono">麦克·记账本 / PERSONAL LEDGER</span>
      <h1>${title}</h1>
      <div class="desc">${desc}</div>
    </div>
    <div>${right||''}</div>
  </div>`;
}
function ymPicker(){
  const [cy,cm]=filterMonth.split('-').map(Number);
  const thisY=new Date().getFullYear();
  let ys='';for(let y=thisY-5;y<=thisY+1;y++)ys+=`<option value="${y}" ${y===cy?'selected':''}>${y}年</option>`;
  let ms='';for(let m=1;m<=12;m++)ms+=`<option value="${m}" ${m===cm?'selected':''}>${m}月</option>`;
  return `<div class="ym">
    <select onchange="pickYear(this.value)" aria-label="年份">${ys}</select>
    <select onchange="pickMonth(this.value)" aria-label="月份">${ms}</select>
  </div>`;
}
function pickYear(y){filterMonth=`${y}-${filterMonth.split('-')[1]}`;render()}
function pickMonth(m){filterMonth=`${filterMonth.split('-')[0]}-${String(m).padStart(2,'0')}`;render()}
function secHead(no,name,note){
  return `<div class="sec-head"><div class="sec-title"><span class="sec-no">${no}</span><span class="sec-name">${name}</span></div>${note?`<span class="sec-note">${note}</span>`:''}</div>`;
}
function emptyState(t,s,glyph){
  return `<div class="empty"><div class="glyph">${glyph||'∅'}</div><div class="t">${t}</div><div class="s">${s}</div></div>`;
}

/* ============================================================
   3. 首页 / 财务总览
   ============================================================ */
function renderOverview(){
  const cur=monthStats(filterMonth), prev=monthStats(shiftYM(filterMonth,-1));
  const bal=totalBalance();
  const budget=Number(settings.monthlyBudget)||0;
  const bPct=budget?Math.min(cur.exp/budget*100,100):0;
  const rate=cur.inc>0?((cur.inc-cur.exp)/cur.inc*100):null;
  const trend=recentMonths(filterMonth,6).map(m=>({ym:m,...monthStats(m)}));
  const cats=catBreakdown(filterMonth);
  const recent=[...db.txs].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0)).slice(0,5);

  let html=masthead('财务总览','一眼看清本期收支与长期余额',ymPicker());

  /* 视觉锚点：本期结余 */
  html+=`<div class="hero">
    <div class="kicker">01 / NET BALANCE — 本期结余</div>
    <div class="hero-num"><span class="cur">¥</span><span class="${cur.bal>=0?'':'spend'}">${num(cur.bal)}</span></div>
    <div class="hero-meta">
      <span>${monthLabel(filterMonth)} · 收入 ${yuan(cur.inc)} − 支出 ${yuan(cur.exp)}</span>
      ${deltaHtml(cur.bal,prev.bal,'较上月')}
    </div>
  </div>`;

  /* 三栏编辑式数据 */
  html+=`<div class="sec">
    ${secHead('02','本期概览','与上月同期对比')}
    <div class="trio">
      <div><div class="lbl">收入 INCOME</div><div class="val gain">${yuan(cur.inc)}</div><div class="sub">${cur.list.filter(t=>t.type==='income').length} 笔 · ${deltaHtml(cur.inc,prev.inc,'')}</div></div>
      <div><div class="lbl">支出 EXPENSE</div><div class="val spend">${yuan(cur.exp)}</div><div class="sub">${cur.list.filter(t=>t.type==='expense').length} 笔 · ${deltaHtml(cur.exp,prev.exp,'')}</div></div>
      <div><div class="lbl">结余率 SAVING RATE</div><div class="val">${rate===null?'—':rate.toFixed(1)+'%'}</div><div class="sub">${rate===null?'本期无收入记录':rate>=0?'收入覆盖支出':'支出超过收入'}</div></div>
    </div>
  </div>`;

  /* 趋势 */
  html+=`<div class="sec">
    ${secHead('03','近六个月收支','点击柱列查看具体数值')}
    ${trendChart(trend)}
  </div>`;

  /* 预算 + 累计余额 */
  html+=`<div class="sec">
    ${secHead('04','预算与余额','数据均来自真实账目')}
    ${budget>0?`
      <div class="budget-head">
        <span class="muted" style="font-size:12px">本月总预算 <b class="budget-num brass">${yuan(budget)}</b></span>
        <span style="font-size:12px;color:${cur.exp>budget?'var(--spend)':'var(--paper-2)'}">已用 ${yuan(cur.exp)} · ${(cur.exp/budget*100).toFixed(0)}%</span>
      </div>
      <div class="budget-track"><div class="f ${cur.exp>budget?'over':''}" style="width:${bPct}%"></div><span class="mark"></span></div>
      <div class="budget-foot"><span>剩余 ${yuan(Math.max(budget-cur.exp,0))}</span><span>预警线 80%</span></div>
      ${cur.exp>budget?`<div class="notice warn">本月支出已超出预算 ${yuan(cur.exp-budget)}。</div>`
        :cur.exp/budget>=0.8?`<div class="notice">已使用预算的 ${(cur.exp/budget*100).toFixed(0)}%，接近上限。</div>`:''}
    `:`
      <div class="stat-line"><span>本月总预算</span><span>未设置 · <button class="link" onclick="go('settings')">前往设置 →</button></span></div>
    `}
    <div class="stat-line" style="margin-top:8px"><span>累计可用余额</span><b>${yuan(bal)}</b></div>
    <div style="font-size:10.5px;color:var(--paper-3);margin-top:8px;line-height:1.6">口径：自首笔记录起，全部历史收入 − 全部历史支出（${db.txs.length} 笔账目累计）。</div>
  </div>`;

  /* 最近记录 */
  html+=`<div class="sec">
    <div class="sec-head"><div class="sec-title"><span class="sec-no">05</span><span class="sec-name">最近记录</span></div><button class="link" onclick="go('ledger')">查看全部 →</button></div>
    ${recent.length?txList(recent,true):emptyState('还没有账目','点右下角「+」记下第一笔','✎')}
  </div>`;

  /* 消费构成 */
  html+=`<div class="sec">
    <div class="sec-head"><div class="sec-title"><span class="sec-no">06</span><span class="sec-name">消费构成</span></div><button class="link" onclick="go('insights')">完整分析 →</button></div>
    ${cats.length?barsHtml(cats.slice(0,5),cur.exp):emptyState('本期暂无支出','记一笔支出后自动生成构成分析','◌')}
  </div>`;
  return html;
}

/* ============================================================
   4. 账单管理
   ============================================================ */
function renderLedger(){
  const [start,end]=[filterMonth+'-01',filterMonth+'-31'];
  let list=db.txs.filter(t=>{
    if(!inMonth(t,filterMonth))return false;
    if(filterType!=='all'&&t.type!==filterType)return false;
    if(filterCat!=='all'&&t.cat!==filterCat)return false;
    if(filterKw&&!`${t.note||''} ${t.cat||''}`.toLowerCase().includes(filterKw.toLowerCase()))return false;
    return true;
  }).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
  const allCats=[...getCats('expense'),...getCats('income')];
  const exp=sum(list.filter(t=>t.type==='expense')),inc=sum(list.filter(t=>t.type==='income'));

  let html=masthead('账单明细',`${monthLabel(filterMonth)} · 共 ${list.length} 笔记录`,ymPicker());
  html+=`<div class="filters">
    <div class="seg">
      <button class="${filterType==='all'?'on':''}" onclick="setFilterType('all')">全部</button>
      <button class="${filterType==='expense'?'on':''}" onclick="setFilterType('expense')">支出</button>
      <button class="${filterType==='income'?'on':''}" onclick="setFilterType('income')">收入</button>
    </div>
    <select onchange="filterCat=this.value;render()" aria-label="分类筛选">
      <option value="all">全部分类</option>
      ${allCats.map(c=>`<option value="${esc(c.name)}" ${filterCat===c.name?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join('')}
    </select>
    <input type="search" class="kw" placeholder="搜索备注 / 分类" value="${esc(filterKw)}" oninput="filterKw=this.value;renderLedgerDebounced()">
  </div>`;
  html+=`<div style="display:flex;gap:22px;font-size:11.5px;color:var(--paper-2);padding:2px 0 14px;border-bottom:1px solid var(--line)">
    <span>筛选结果：支出 <b class="spend num" style="font-size:14px">${yuan(exp)}</b></span>
    <span>收入 <b class="gain num" style="font-size:14px">${yuan(inc)}</b></span>
  </div>`;
  html+=`<div class="sec" style="border:0">${list.length?txList(list):emptyState('没有符合条件的账目','换个筛选条件，或记一笔新账','⌕')}</div>`;
  return html;
}
let _kwTimer=null;
function renderLedgerDebounced(){
  clearTimeout(_kwTimer);
  _kwTimer=setTimeout(()=>{
    const el=document.querySelector('.filters .kw');
    const pos=el?el.selectionStart:null;
    render();
    const n=document.querySelector('.filters .kw');
    if(n){n.focus();if(pos!=null)try{n.setSelectionRange(pos,pos)}catch(e){}}
  },180);
}
function setFilterType(t){filterType=t;render()}

function txList(list,compact){
  const groups={};
  list.forEach(t=>{(groups[t.date||'未知日期']=groups[t.date||'未知日期']||[]).push(t)});
  return Object.keys(groups).sort().reverse().map(d=>{
    const items=groups[d];
    const e=sum(items.filter(t=>t.type==='expense')),i=sum(items.filter(t=>t.type==='income'));
    return `<div class="tx-day"><span class="d">${dayLabel(d)}</span><span class="s">${e?'支 '+num(e):''}${e&&i?' · ':''}${i?'收 '+num(i):''}</span></div>
      ${items.map(t=>{
        const c=findCat(t.type,t.cat),p=t.project?findProject(t.project):null;
        return `<div class="tx" style="--c:${c.color}" onclick="openTx('${t.id}')">
          <div class="tx-ic" style="background:${c.color}1c">${c.emoji}</div>
          <div class="tx-body">
            <span class="tx-name">${esc(t.note||t.cat||'未命名')}</span>
            <div class="tx-tag"><span>${esc(t.cat||'未分类')}</span>${p?`<span class="p">${p.emoji} ${esc(p.name)}</span>`:''}</div>
          </div>
          <div class="tx-amt ${t.type==='expense'?'spend':'gain'}">${t.type==='expense'?'−':'+'}${num(t.amount)}</div>
          ${compact?'':`<button class="tx-del" title="删除" onclick="event.stopPropagation();askDeleteTx('${t.id}')">✕</button>`}
        </div>`;
      }).join('')}`;
  }).join('');
}

/* ============================================================
   5. 消费分析（全部基于真实账目）
   ============================================================ */
function catBreakdown(ym){
  const l=db.txs.filter(t=>inMonth(t,ym)&&t.type==='expense');
  const m={};l.forEach(t=>{m[t.cat||'未分类']=(m[t.cat||'未分类']||0)+Number(t.amount||0)});
  return Object.entries(m).map(([name,v])=>({name,v,c:findCat('expense',name)})).sort((a,b)=>b.v-a.v);
}
function barsHtml(cats,total){
  return `<div class="bars">${cats.map(x=>{
    const p=total?x.v/total*100:0;
    return `<div class="bar-row">
      <div class="bar-name"><span class="bar-emoji">${x.c.emoji}</span>${esc(x.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${x.c.color}"></div></div>
      <div class="bar-val">${num(x.v)}<span class="bar-pct">${p.toFixed(1)}%</span></div>
    </div>`;
  }).join('')}</div>`;
}
function trendChart(data){
  const W=360,H=132,P=10;
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  const n=data.length;
  const X=i=>P+(W-2*P)*(n===1?.5:i/(n-1));
  const Y=v=>H-P-(H-2*P)*(v/max);
  const pts=k=>data.map((d,i)=>`${X(i).toFixed(1)},${Y(d[k]).toFixed(1)}`).join(' ');
  const area=(k)=>`M ${X(0).toFixed(1)},${H-P} L ${data.map((d,i)=>`${X(i).toFixed(1)},${Y(d[k]).toFixed(1)}`).join(' L ')} L ${X(n-1).toFixed(1)},${H-P} Z`;
  const grid=[0,.5,1].map(r=>`<line class="chart-grid" x1="${P}" y1="${(P+(H-2*P)*r).toFixed(1)}" x2="${W-P}" y2="${(P+(H-2*P)*r).toFixed(1)}"/>`).join('');
  const hits=data.map((d,i)=>{
    const w=(W-2*P)/Math.max(n-1,1),x=n===1?P:X(i)-w/2;
    return `<rect class="chart-hit" x="${Math.max(0,x).toFixed(1)}" y="0" width="${Math.min(w,W).toFixed(1)}" height="${H}" onclick="showTip(event,${i},'trend')" onmouseenter="showTip(event,${i},'trend')"/>`;
  }).join('');
  const dots=data.map((d,i)=>`
    <i style="left:${(X(i)/W*100).toFixed(2)}%;top:${(Y(d.exp)/H*100).toFixed(2)}%;background:var(--spend)"></i>
    <i style="left:${(X(i)/W*100).toFixed(2)}%;top:${(Y(d.inc)/H*100).toFixed(2)}%;background:var(--gain)"></i>`).join('');
  return `<div class="chart-box">
    <div class="chart-tip" id="chartTip"></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:132px" aria-label="近六个月收支趋势">
      ${grid}
      <path class="chart-area" d="${area('exp')}" fill="var(--spend)"/>
      <polyline class="chart-line" points="${pts('exp')}" stroke="var(--spend)"/>
      <polyline class="chart-line" points="${pts('inc')}" stroke="var(--gain)"/>
      ${hits}
    </svg>
    <div class="dot-layer">${dots}</div>
    <div class="chart-axis">${data.map(d=>`<span>${shortMonth(d.ym)}</span>`).join('')}</div>
    <div class="chart-legend"><span><i style="background:var(--spend)"></i>支出</span><span><i style="background:var(--gain)"></i>收入</span><span class="faint">峰值 ${yuan(max)}</span></div>
  </div>`;
}
function balanceChart(data){
  const W=360,H=118,P=10;
  const vals=data.map(d=>d.bal);
  const max=Math.max(1,...vals.map(Math.abs));
  const n=data.length,bw=(W-2*P)/n*.5;
  const zero=P+(H-2*P)/2;
  const bars=data.map((d,i)=>{
    if(Math.abs(d.bal)<0.005)return '';          // 零结余不画柱子，避免贴轴细线造成误读
    const x=P+(W-2*P)*(i+.5)/n-bw/2;
    const h=Math.max(2,(Math.abs(d.bal)/max)*((H-2*P)/2));
    const y=d.bal>=0?zero-h:zero;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${d.bal>=0?'var(--gain)':'var(--spend)'}" opacity=".82"/>`;
  }).join('');
  const hits=data.map((d,i)=>{
    const w=(W-2*P)/n,x=P+(W-2*P)*i/n;
    return `<rect class="chart-hit" x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${H}" onclick="showTip(event,${i},'balance')" onmouseenter="showTip(event,${i},'balance')"/>`;
  }).join('');
  return `<div class="chart-box">
    <div class="chart-tip" id="chartTip2"></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:118px" aria-label="月度结余变化">
      <line class="chart-grid" x1="${P}" y1="${zero}" x2="${W-P}" y2="${zero}"/>
      ${bars}${hits}
    </svg>
    <div class="chart-axis">${data.map(d=>`<span>${shortMonth(d.ym)}</span>`).join('')}</div>
    <div class="chart-legend"><span><i style="background:var(--gain)"></i>结余为正</span><span><i style="background:var(--spend)"></i>入不敷出</span></div>
  </div>`;
}
function bindChartTips(){
  chartData.trend=recentMonths(filterMonth,6).map(m=>({ym:m,...monthStats(m)}));
  chartData.balance=chartData.trend.map(d=>({ym:d.ym,bal:d.bal}));
}
let _tipTimer=null;
function showTip(ev,i,kind){
  const box=document.getElementById(kind==='trend'?'chartTip':'chartTip2');
  if(!box)return;
  const d=chartData[kind][i];if(!d)return;
  box.innerHTML=kind==='trend'
    ? `${monthLabel(d.ym)} · 支出 <b class="spend">${yuan(d.exp)}</b> / 收入 <b class="gain">${yuan(d.inc)}</b>`
    : `${monthLabel(d.ym)} · 结余 <b class="${d.bal>=0?'gain':'spend'}">${yuan(d.bal)}</b>`;
  const wrap=box.parentElement.getBoundingClientRect();
  const r=ev.currentTarget.getBoundingClientRect();
  box.style.left=Math.max(0,Math.min(wrap.width,r.left-wrap.left+r.width/2))+'px';
  box.classList.add('show');
  clearTimeout(_tipTimer);_tipTimer=setTimeout(()=>box.classList.remove('show'),2600);
}
function renderInsights(){
  const months=recentMonths(filterMonth,6).map(m=>({ym:m,...monthStats(m)}));
  const cur=monthStats(filterMonth);
  const cats=catBreakdown(filterMonth);
  const ranking=[...months].filter(m=>m.exp>0).sort((a,b)=>b.exp-a.exp).slice(0,6);
  const prev3=months.slice(-4,-1).filter(m=>m.exp>0);
  const avg3=prev3.length?prev3.reduce((s,m)=>s+m.exp,0)/prev3.length:0;
  const insights=[];
  if(avg3>0&&cur.exp>avg3*1.25)insights.push({w:true,t:`本期支出 ${yuan(cur.exp)}，较近三个月均值 ${yuan(avg3)} 高出 ${((cur.exp/avg3-1)*100).toFixed(0)}%。`});
  else if(avg3>0&&cur.exp<avg3*.75)insights.push({w:false,t:`本期支出 ${yuan(cur.exp)}，低于近三个月均值 ${yuan(avg3)}，控制得不错。`});
  if(cats.length&&cur.exp>0&&cats[0].v/cur.exp>=.4)insights.push({w:false,t:`「${esc(cats[0].name)}」占本期支出 ${(cats[0].v/cur.exp*100).toFixed(0)}%，是最大的消费类别。`});
  if(cur.bal<0)insights.push({w:true,t:`本期结余为负（${yuan(cur.bal)}），支出超过收入。`});
  if(db.txs.length<2)insights.length=0;

  let html=masthead('消费分析','基于真实账目的趋势、结构与变化',ymPicker());
  html+=`<div class="sec">${secHead('01','收支趋势','近六个月 · 点击柱列查看数值')}${trendChart(months)}</div>`;
  html+=`<div class="sec">${secHead('02','消费分类占比',`${monthLabel(filterMonth)} · 合计 ${yuan(cur.exp)}`)}${cats.length?barsHtml(cats,cur.exp):emptyState('本期没有支出','切换月份或记一笔支出','◌')}</div>`;
  html+=`<div class="sec">${secHead('03','月度结余变化','零轴以上为盈余，以下为超支')}${balanceChart(months)}</div>`;
  html+=`<div class="sec">${secHead('04','每月消费排行','按真实支出金额排序')}
    ${ranking.length?ranking.map((m,i)=>`<div class="rank-row">
      <span class="rank-no">${String(i+1).padStart(2,'0')}</span>
      <span class="rank-nm">${monthLabel(m.ym)}</span>
      <span class="rank-mini"><i style="width:${(m.exp/ranking[0].exp*100).toFixed(0)}%"></i></span>
      <span class="rank-v spend">${num(m.exp)}</span>
    </div>`).join(''):emptyState('暂无可排行的月份','有支出记录后自动生成','◌')}
  </div>`;
  html+=`<div class="sec">${secHead('05','消费洞察','由账目自动推导，不做推测')}
    ${insights.length?insights.map(x=>`<div class="notice ${x.w?'warn':''}">${x.t}</div>`).join(''):emptyState('暂无可提示的变化','累计至少两笔账目后自动生成洞察','✧')}
  </div>`;
  /* 分类预算执行情况 */
  const cb=Object.entries(settings.catBudgets||{}).filter(([k,v])=>Number(v)>0);
  if(cb.length){
    html+=`<div class="sec">${secHead('06','分类预算执行','与本期真实支出关联')}
      ${cb.map(([name,b])=>{
        const used=(cats.find(c=>c.name===name)||{v:0}).v, p=Math.min(used/Number(b)*100,100);
        return `<div style="margin-bottom:18px">
          <div class="budget-head" style="margin-bottom:8px"><span style="font-size:12.5px">${esc(name)}</span><span style="font-size:11.5px;color:${used>b?'var(--spend)':'var(--paper-2)'}">${yuan(used)} / ${yuan(b)}</span></div>
          <div class="budget-track"><div class="f ${used>b?'over':''}" style="width:${p}%"></div></div>
        </div>`;
      }).join('')}
    </div>`;
  }
  return html;
}

/* ============================================================
   6. 项目记账（保留原有项目数据与 budget 字段）
   ============================================================ */
function renderProjects(){
  let html=masthead('项目记账','按旅行、订阅、游戏等主题独立归集支出',
    `<button class="btn solid" onclick="openProj()">+ 新建项目</button>`);
  if(activeProject){

    const list=db.txs.filter(t=>t.project===p.id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
    const spent=sum(list.filter(t=>t.type==='expense')),budget=Number(p.budget)||0;
    const pct=budget?Math.min(spent/budget*100,100):0;
    html+=`<div class="sec" style="padding-top:22px">
      <button class="link" onclick="activeProject=null;render()">← 返回项目列表</button>
      <div class="budget-head" style="margin-top:20px">

        <div style="text-align:right"><div class="faint" style="font-size:10.5px">累计支出</div><div class="num spend" style="font-size:26px">${yuan(spent)}</div></div>
      </div>
      ${budget>0?`
        <div class="budget-track"><div class="f ${spent>budget?'over':''}" style="width:${pct}%"></div></div>
        <div class="budget-foot"><span>预算 ${yuan(budget)} · 已用 ${(spent/budget*100).toFixed(0)}%</span><span class="${spent>budget?'spend':''}">${spent>budget?'超支 '+yuan(spent-budget):'剩余 '+yuan(budget-spent)}</span></div>
      `:`<div class="stat-line" style="margin-top:14px"><span>项目预算</span><span>未设置 · <button class="link" onclick="openProj('${p.id}')">设置 →</button></span></div>`}

      </div>
    </div>`;
    html+=`<div class="sec">${secHead('02','项目流水',`${list.length} 笔记录`)}${list.length?txList(list):emptyState('这个项目还没有账目','点「+ 记一笔」开始归集','✎')}</div>`;
    return html;

  const total=db.projects.reduce((s,p)=>s+sum(db.txs.filter(t=>t.project===p.id&&t.type==='expense')),0);
  html+=`<div class="sec">${secHead('01','我的项目',`${db.projects.length} 个项目 · 合计支出 ${yuan(total)}`)}
    ${db.projects.length?db.projects.map(p=>{
      const l=db.txs.filter(t=>t.project===p.id);
      const s=sum(l.filter(t=>t.type==='expense')),b=Number(p.budget)||0;
      const pct=b?Math.min(s/b*100,100):0;
      return `<div class="proj-row" onclick="activeProject='${p.id}';render();window.scrollTo(0,0)">
        <div class="proj-ic" style="background:${p.color}18">${p.emoji}</div>
        <div class="proj-main">
          <div class="proj-nm">${esc(p.name)}</div>
          <div class="proj-sub">${l.length} 笔记录${b?` · 预算 ${num(b)}`:''}</div>
          ${b?`<div class="proj-bar" style="max-width:180px"><i style="width:${pct}%;background:${s>b?'var(--spend)':'var(--brass)'}"></i></div>`:''}
        </div>
        <div class="proj-amt"><span class="v spend">${num(s)}</span><span class="l">累计支出</span></div>
        <button class="proj-x" title="删除" onclick="event.stopPropagation();askDeleteProject('${p.id}')">✕</button>
      </div>`;
    }).join(''):emptyState('还没有项目','把一次旅行、一项订阅单独归集，账目会更清楚','◈')}
  </div>`;
  return html;
}

function catChips(type){
  const base=DEFAULT_CATS[type].map(c=>({...c,builtin:true}));
  const custom=(settings.customCats[type]||[]).map(c=>({...c,builtin:false}));
  const hidden=settings.hiddenCats[type]||[];
  return base.concat(custom).map(c=>{
    const i=DEFAULT_CATS[type].concat(settings.customCats[type]||[]).findIndex(x=>x.name===c.name);
    const off=hidden.includes(c.name);
    return `<span class="cat-chip" style="${off?'opacity:.42;text-decoration:line-through':''}">${c.emoji} ${esc(c.name)}
      <button title="${off?'恢复':'隐藏/删除'}" onclick="toggleCat('${type}',${i},${c.builtin})">${off?'↺':'✕'}</button></span>`;
  }).join('')||'<span class="faint" style="font-size:12px">暂无分类</span>';
}
function toggleCat(type,i,builtin){
  const all=DEFAULT_CATS[type].concat(settings.customCats[type]||[]);
  const c=all[i];if(!c)return;
  const hidden=settings.hiddenCats[type]||[];
  if(hidden.includes(c.name)){
    settings.hiddenCats[type]=hidden.filter(n=>n!==c.name);saveSettings();render();toast('已恢复分类');return;
  }
  const used=db.txs.filter(t=>t.type===type&&t.cat===c.name).length;
  confirmDo(builtin?'隐藏分类':'删除分类',
    `确定${builtin?'隐藏':'删除'}「${esc(c.name)}」吗？${used?`<br>已有 <b style="color:var(--brass)">${used} 笔</b>账目使用该分类，历史账目仍会完整保留并正常显示。`:''}`,
    ()=>{
      if(builtin)settings.hiddenCats[type]=hidden.concat(c.name);
      else settings.customCats[type]=(settings.customCats[type]||[]).filter(x=>x.name!==c.name);
      saveSettings();render();toast(builtin?'已隐藏':'已删除');
    },builtin?'隐藏':'删除');
}
function addCat(){
  const name=document.getElementById('newCatName').value.trim();
  const type=document.getElementById('newCatType').value;
  if(!name){toast('请输入分类名称',true);return}
  if(findCat(type,name).name===name&&DEFAULT_CATS[type].concat(settings.customCats[type]||[]).some(c=>c.name===name)){
    toast('该分类已存在',true);return;
  }
  const palette=['#E8836B','#7FA6D9','#D18BAE','#A89BD1','#7CBCC4','#8FB79A','#D8B45C','#9AA098'];
  settings.customCats[type]=(settings.customCats[type]||[]).concat({
    name,emoji:'✦',color:palette[(settings.customCats[type]||[]).length%palette.length]
  });
  saveSettings();render();toast('已添加分类');
}
function saveBudgets(){
  const b=parseFloat(document.getElementById('sBudget').value);
  settings.monthlyBudget=isNaN(b)||b<0?0:b;
  document.querySelectorAll('.cat-budget').forEach(el=>{
    const v=parseFloat(el.value);
    if(!isNaN(v)&&v>0)settings.catBudgets[el.dataset.cat]=v;
    else delete settings.catBudgets[el.dataset.cat];
  });
  saveSettings();render();toast('预算已保存');
}
function buildExport(){
  return {version:1,app:'麦克·记账本',exportedAt:new Date().toISOString(),data:db,settings:settings};
}
function exportData(){
  const text=JSON.stringify(buildExport(),null,2);
  try{
    const blob=new Blob([text],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`麦克记账本备份-${currentMonth()}-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    toast('备份文件已导出');
  }catch(e){toast('导出失败，请改用复制备份',true)}
}
async function copyData(){
  const text=JSON.stringify(buildExport());
  try{await navigator.clipboard.writeText(text);toast('备份已复制，可粘贴到备忘录保存')}
  catch(e){
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);
    ta.select();try{document.execCommand('copy');toast('备份已复制')}catch(_){toast('复制失败，请使用导出文件',true)}ta.remove();
  }
}
function openImport(){document.getElementById('importText').value='';openOverlay('importOverlay')}
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{document.getElementById('importText').value=r.result;toast('文件已读取，点「合并导入」完成')};
  r.onerror=()=>toast('文件读取失败',true);
  r.readAsText(f);e.target.value='';
});
function doImport(){
  const raw=document.getElementById('importText').value.trim();
  if(!raw){toast('请先粘贴备份内容',true);return}
  const o=safeParse(raw);
  const data=o&&(o.data||o);
  if(!data||!Array.isArray(data.txs)){toast('备份格式无法识别',true);return}
  const existing=new Set(db.txs.map(t=>t.id));
  const addT=data.txs.filter(t=>t&&t.id&&!existing.has(t.id));
  const exP=new Set(db.projects.map(p=>p.id));
  const addP=(Array.isArray(data.projects)?data.projects:[]).filter(p=>p&&p.id&&!exP.has(p.id));
  if(!addT.length&&!addP.length){toast('备份中没有新记录');closeOverlay('importOverlay');return}
  confirmDo('确认导入',`将合并 <b style="color:var(--brass)">${addT.length} 笔账目</b>与 ${addP.length} 个项目。<br>现有 ${db.txs.length} 笔账目不会被覆盖或删除。`,()=>{
    db.txs=db.txs.concat(addT);db.projects=db.projects.concat(addP);
    if(o.settings&&typeof o.settings==='object'){
      settings=Object.assign(defaultSettings(),settings,o.settings);saveSettings();setTheme(settings.theme||'ink');
    }
    persist();closeOverlay('importOverlay');render();toast(`已合并 ${addT.length} 笔账目`);
  },'合并导入');
}
function restoreSnapshot(){
  const sn=localStorage.getItem(SNAPSHOT_KEY);
  if(!sn){toast('暂无原始快照（首次启动且无账目时不会生成）',true);return}
  const o=safeParse(sn);
  confirmDo('原始快照',`快照保存于本应用首次启动时，包含 <b style="color:var(--brass)">${o&&Array.isArray(o.txs)?o.txs.length:0} 笔</b>账目。<br>可将其内容粘贴到「导入 / 合并备份」中恢复，当前账目不会被删除。`,()=>{
    document.getElementById('importText').value=JSON.stringify({version:1,data:o},null,2);
    openOverlay('importOverlay');
  },'查看并导入');
}
function askClearAll(){
  confirmDo('清空全部数据',`将删除本机 <b style="color:var(--spend)">${db.txs.length} 笔账目</b>与 ${db.projects.length} 个项目。<br>此操作不可撤销，建议先导出备份。`,()=>{
    confirmDo('再次确认',`确定继续吗？清空后会保留一份写入前的自动备份（ledger_backup_v1），但普通界面不再显示这些账目。`,()=>{
      persist(); // 先把当前完整数据写入滚动备份
      db={txs:[],projects:[]};
      persist();
      render();toast('数据已清空');
    },'确定清空');
  },'我已备份，继续');
}

/* ============================================================
   8. 快速记账（保留原有字段结构）
   ============================================================ */
function openTx(id,presetProject){
  txForm={type:'expense',cat:null,project:presetProject||null,editing:id||null};
  const editing=id?db.txs.find(t=>t.id===id):null;
  if(id&&!editing)return;
  if(editing){
    txForm.type=editing.type;txForm.cat=editing.cat;txForm.project=editing.project||null;
    document.getElementById('fAmount').value=editing.amount;
    document.getElementById('fNote').value=editing.note||'';
    document.getElementById('fDate').value=editing.date||'';
    document.getElementById('txTitle').textContent='编辑记录';
    document.getElementById('txFoot').innerHTML=`
      <button class="btn danger" onclick="askDeleteTx('${editing.id}')">删除</button>
      <button class="btn solid" onclick="saveTx()">保存修改</button>`;
  }else{
    document.getElementById('fAmount').value='';
    document.getElementById('fNote').value='';
    document.getElementById('fDate').value=new Date().toISOString().slice(0,10);
    document.getElementById('txTitle').textContent='记一笔';
    document.getElementById('txFoot').innerHTML=`<button class="btn solid" onclick="saveTx()">保存记录</button>`;
    txForm.cat=settings.lastCat.expense||getCats('expense')[0]?.name||null;   // 预选最常用分类，减少点击
  }
  renderTypeSwitch();renderCatScroll();renderProjectSelect();
  openOverlay('txOverlay');
  setTimeout(()=>{try{document.getElementById('fAmount').focus()}catch(e){}},220);
}
function setType(t){
  txForm.type=t;
  txForm.cat=settings.lastCat[t]||getCats(t)[0]?.name||null;
  txForm.project=t==='income'?null:txForm.project;
  renderTypeSwitch();renderCatScroll();
  document.getElementById('projFieldWrap').style.display=t==='income'?'none':'';
}
function renderTypeSwitch(){
  document.getElementById('tsExp').className=txForm.type==='expense'?'on':'';
  document.getElementById('tsInc').className=txForm.type==='income'?'on':'';
  document.getElementById('projFieldWrap').style.display=txForm.type==='income'?'none':'';
}
function renderCatScroll(){
  const cats=getCats(txForm.type);
  // 常用分类优先：按真实历史使用次数排序
  const freq={};db.txs.filter(t=>t.type===txForm.type).forEach(t=>{freq[t.cat]=(freq[t.cat]||0)+1});
  const ordered=[...cats].sort((a,b)=>(freq[b.name]||0)-(freq[a.name]||0));
  if(txForm.cat&&!ordered.some(c=>c.name===txForm.cat))ordered.unshift(findCat(txForm.type,txForm.cat));
  document.getElementById('catScroll').innerHTML=ordered.map(c=>{
    const i=cats.findIndex(x=>x.name===c.name);
    return `<button class="cat-opt ${txForm.cat===c.name?'on':''}" onclick="selectCat(${i})"><span class="e">${c.emoji}</span>${esc(c.name)}</button>`;
  }).join('');
  window._catList=cats;
}
function selectCat(i){
  const c=window._catList&&window._catList[i];if(!c)return;
  txForm.cat=c.name;
  settings.lastCat[txForm.type]=c.name;saveSettings();
  renderCatScroll();
}
function renderProjectSelect(){
  document.getElementById('fProject').innerHTML=`<option value="">不关联项目</option>`+
    db.projects.map(p=>`<option value="${p.id}" ${txForm.project===p.id?'selected':''}>${p.emoji} ${esc(p.name)}</option>`).join('');
}
function saveTx(){
  const wasEditing=!!txForm.editing;
  const amtEl=document.getElementById('fAmount');
  const amount=parseFloat(String(amtEl.value).replace(/[^\d.]/g,''));
  if(!amount||amount<=0||isNaN(amount)){toast('请输入有效金额',true);amtEl.focus();return}
  if(!txForm.cat){toast('请选择一个分类',true);return}
  const note=document.getElementById('fNote').value.trim();
  const date=document.getElementById('fDate').value;
  if(!date){toast('请选择日期',true);return}
  const project=txForm.type==='expense'?(document.getElementById('fProject').value||null):null;
  if(txForm.editing){
    const t=db.txs.find(x=>x.id===txForm.editing);
    if(t)Object.assign(t,{amount,cat:txForm.cat,note,date,project,type:txForm.type});
    toast('已更新记录');
  }else{
    db.txs.push({id:uid(),type:txForm.type,amount,cat:txForm.cat,note,date,project,createdAt:Date.now()});
    toast('已记录 '+yuan(amount));
  }
  persist();closeOverlay('txOverlay');
  // 仅新增记录时跳到该账目月份；编辑旧账不打断当前视图
  if(!wasEditing&&ymOf(date)!==filterMonth)filterMonth=ymOf(date);
  render();
}
function askDeleteTx(id){
  const t=db.txs.find(x=>x.id===id);if(!t)return;
  confirmDo('删除这笔记录',`「${esc(t.note||t.cat||'未命名')}」 ${yuan(t.amount)} · ${t.date}<br>删除后不可恢复。`,()=>{
    db.txs=db.txs.filter(x=>x.id!==id);
    persist();closeOverlay('txOverlay');render();toast('已删除');
  },'删除');
}

/* ============================================================
   9. 项目管理
   ============================================================ */
function openProj(id){
  const p=id?findProject(id):null;
  if(id&&!p)return;
  projForm=p?{emoji:p.emoji,color:p.color,editing:p.id}:{emoji:'✈️',color:'#7FA6D9',editing:null};
  document.getElementById('pName').value=p?p.name:'';
  document.getElementById('pBudget').value=p?(p.budget||''):'';
  document.getElementById('projTitle').textContent=p?'编辑项目':'新建项目';
  document.getElementById('projFoot').innerHTML=p
    ?`<button class="btn solid" onclick="saveProject()">保存修改</button>`
    :`<button class="btn solid" onclick="saveProject()">创建项目</button>`;
  renderProjIcons();openOverlay('projOverlay');
  setTimeout(()=>{try{document.getElementById('pName').focus()}catch(e){}},220);
}
function renderProjIcons(){
  document.getElementById('pIconScroll').innerHTML=PROJECT_PRESETS.map((p,i)=>`
    <button class="cat-opt ${projForm.emoji===p.emoji?'on':''}" onclick="selectProjIcon(${i})"><span class="e">${p.emoji}</span>${p.label}</button>`).join('');
}
function selectProjIcon(i){
  const p=PROJECT_PRESETS[i];if(!p)return;
  projForm.emoji=p.emoji;projForm.color=p.color;renderProjIcons();
}
function saveProject(){
  const name=document.getElementById('pName').value.trim();
  if(!name){toast('请输入项目名称',true);return}
  const b=parseFloat(document.getElementById('pBudget').value);
  const budget=isNaN(b)||b<=0?'':String(b);
  if(projForm.editing){
    const p=findProject(projForm.editing);
    if(p){p.name=name;p.emoji=projForm.emoji;p.color=projForm.color;p.budget=budget}
    toast('项目已更新');
  }else{
    db.projects.push({id:uid(),name,emoji:projForm.emoji,color:projForm.color,budget});
    toast('项目已创建');
  }
  persist();closeOverlay('projOverlay');
  view='projects';activeProject=null;render();
}
function askDeleteProject(id){
  const p=findProject(id);if(!p)return;
  const n=db.txs.filter(t=>t.project===id).length;
  confirmDo('删除项目',`确定删除「${esc(p.name)}」吗？${n?`<br>其下 <b style="color:var(--brass)">${n} 笔账目会保留</b>，仅解除项目关联。`:''}`,()=>{
    db.txs.forEach(t=>{if(t.project===id)t.project=null});
    db.projects=db.projects.filter(x=>x.id!==id);
    persist();activeProject=null;render();toast('项目已删除，账目已保留');
  },'删除');
}

/* ============================================================
   10. 启动
   ============================================================ */
setTheme(settings.theme||'ink');
render();
</script>
</body>
</html>
