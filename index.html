<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>记账本</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f0f2f5;
    --border: #e8eaed;
    --text: #1a1d21;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --primary: #2563eb;
    --primary-soft: #eef3ff;
    --income: #e11d48;      /* 支出 - 红（符合中文语境：支出/涨用红） */
    --expense: #059669;     /* 收入 - 绿 */
    --danger: #dc2626;
    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.05);
    --shadow-lg: 0 12px 40px rgba(16,24,40,.14);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font-family: inherit; font-size: 14px; color: var(--text); }
  input:focus, select:focus, textarea:focus { outline: none; }

  /* ===== 布局骨架 ===== */
  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }

  /* 顶栏 */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    display: grid; place-items: center;
    color: #fff; font-size: 17px; font-weight: 700;
  }
  .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
  .brand .sub { font-size: 12px; color: var(--text-3); }

  .top-actions { display: flex; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 15px; border-radius: 10px;
    font-size: 13px; font-weight: 600;
    background: var(--surface); border: 1px solid var(--border);
    transition: all .15s ease;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-ghost { color: var(--text-2); }

  /* 概览卡片 */
  .overview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
  }
  .stat-label { font-size: 12.5px; color: var(--text-2); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .stat-value { font-size: 26px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .stat-value.income { color: var(--income); }
  .stat-value.expense { color: var(--expense); }
  .stat-sub { font-size: 12px; color: var(--text-3); margin-top: 5px; font-variant-numeric: tabular-nums; }

  /* 模块切换 */
  .seg {
    display: inline-flex; background: var(--surface-2);
    padding: 4px; border-radius: 11px; margin-bottom: 22px;
    border: 1px solid var(--border);
  }
  .seg button {
    padding: 8px 20px; border-radius: 8px; font-size: 13.5px; font-weight: 600;
    color: var(--text-2); transition: all .15s;
  }
  .seg button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  /* 主区域双栏 */
  .layout { display: grid; grid-template-columns: 1fr 340px; gap: 18px; align-items: start; }

  /* 列表区 */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .panel-head h2 { font-size: 15px; font-weight: 700; }
  .panel-head .count { font-size: 12px; color: var(--text-3); }

  .filters { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .filters select, .filters input {
    height: 34px; padding: 0 10px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); font-size: 13px;
  }
  .filters .month { color: var(--text-2); }
  .filters .kw { flex: 1; min-width: 120px; }

  .month-nav {
    display: inline-flex; align-items: center; gap: 4px;
    height: 34px; padding: 0 4px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface);
  }
  .month-nav button {
    width: 26px; height: 26px; border-radius: 6px;
    display: grid; place-items: center;
    font-size: 18px; line-height: 1; color: var(--text-2);
    transition: background .12s;
  }
  .month-nav button:hover { background: var(--surface-2); color: var(--text); }
  .month-nav .month-label {
    min-width: 86px; text-align: center;
    font-size: 13px; font-weight: 600; color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* 流水列表 */
  .tx-list { max-height: 560px; overflow-y: auto; }
  .tx-group { padding: 6px 0; }
  .tx-date {
    padding: 12px 20px 6px; font-size: 12px; font-weight: 600; color: var(--text-3);
    position: sticky; top: 0; background: var(--surface); z-index: 1;
  }
  .tx-date .day-total { float: right; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .tx-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 20px; cursor: pointer; transition: background .12s;
    position: relative;
  }
  .tx-item:hover { background: var(--surface-2); }
  .tx-del {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 7px;
    display: grid; place-items: center; color: var(--text-3); font-size: 14px;
    opacity: 0; transition: all .15s; background: var(--surface);
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .tx-item:hover .tx-del { opacity: 1; }
  .tx-del:hover { background: #fef2f2; color: var(--danger); }
  .tx-icon {
    width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 18px;
  }
  .tx-main { flex: 1; min-width: 0; }
  .tx-title { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 7px; }
  .tx-meta { font-size: 12px; color: var(--text-3); margin-top: 1px; }
  .tx-cat-tag {
    font-size: 10.5px; padding: 2px 7px; border-radius: 5px; font-weight: 600;
    background: var(--primary-soft); color: var(--primary);
  }
  .tx-proj-tag { background: #fef3c7; color: #b45309; }
  .tx-amount { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .tx-item:hover .tx-amount { padding-right: 30px; }
  .tx-amount.income { color: var(--income); }
  .tx-amount.expense { color: var(--expense); }

  .empty { padding: 60px 20px; text-align: center; color: var(--text-3); }
  .empty .icon { font-size: 40px; margin-bottom: 12px; }
  .empty p { font-size: 13px; }

  /* 项目卡片区 */
  .proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .proj-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow); cursor: pointer; transition: all .15s;
    display: flex; flex-direction: column; gap: 8px; position: relative;
  }
  .proj-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .proj-top { display: flex; align-items: center; gap: 10px; }
  .proj-icon { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-size: 19px; flex-shrink: 0; }
  .proj-name { font-weight: 700; font-size: 14.5px; }
  .proj-desc { font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
  .proj-del {
    position: absolute; top: 10px; right: 10px;
    width: 28px; height: 28px; border-radius: 8px;
    display: grid; place-items: center; color: var(--text-3); font-size: 15px;
    opacity: 0; transition: all .15s; background: var(--surface-2);
  }
  .proj-card:hover .proj-del { opacity: 1; }
  .proj-del:hover { background: #fef2f2; color: var(--danger); }
  .proj-stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); }
  .proj-stats b { font-variant-numeric: tabular-nums; }
  .proj-stats .spend { color: var(--income); }
  .proj-bar { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 2px; }
  .proj-bar .fill { height: 100%; background: linear-gradient(90deg, #2563eb, #4f46e5); border-radius: 3px; transition: width .4s; }

  /* 侧栏 */
  .side { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 16px; }
  .side .card { padding: 16px 18px; }

  /* 分类统计 */
  .cat-stat { display: flex; flex-direction: column; gap: 12px; }
  .cat-row { display: flex; align-items: center; gap: 10px; }
  .cat-row .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 14px; flex-shrink: 0; }
  .cat-row .nm { flex: 1; font-size: 13px; font-weight: 500; }
  .cat-row .bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .cat-row .bar .f { height: 100%; border-radius: 3px; }
  .cat-row .val { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-2); width: 72px; text-align: right; }

  /* 弹窗 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(15,20,30,.42); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(2px);
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--surface); border-radius: 18px; width: 100%; max-width: 440px;
    box-shadow: var(--shadow-lg); animation: pop .18s ease;
    max-height: 92vh; overflow-y: auto;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 12px; }
  .modal-head h3 { font-size: 16px; font-weight: 700; }
  .modal-close { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--text-3); font-size: 18px; }
  .modal-close:hover { background: var(--surface-2); color: var(--text); }
  .modal-body { padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 14px; }

  .type-toggle { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; border: 1px solid var(--border); }
  .type-toggle button { flex: 1; padding: 9px; border-radius: 8px; font-weight: 600; font-size: 13.5px; color: var(--text-2); }
  .type-toggle button.on-exp { background: #fff; color: var(--income); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .type-toggle button.on-inc { background: #fff; color: var(--expense); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .field input, .field select, .field textarea {
    border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px;
    background: var(--surface); transition: border .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
  .field textarea { resize: none; min-height: 56px; }
  .amount-box { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
  .amount-box span { padding: 10px 12px; font-weight: 700; color: var(--text-2); background: var(--surface-2); border-right: 1px solid var(--border); }
  .amount-box input { border: none; flex: 1; font-size: 20px; font-weight: 700; padding: 8px 14px; }

  .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cat-opt {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 4px; border-radius: 10px; border: 1px solid var(--border);
    font-size: 11.5px; color: var(--text-2); transition: all .12s;
  }
  .cat-opt .em { font-size: 20px; }
  .cat-opt.sel { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 600; }

  .modal-foot { display: flex; gap: 10px; padding: 0 20px 20px; }
  .modal-foot .btn { flex: 1; justify-content: center; padding: 11px; }
  .btn-danger { color: var(--danger); border-color: #fecaca; background: #fff; }
  .btn-danger:hover { background: #fef2f2; }

  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px);
    background: #1a1d21; color: #fff; padding: 11px 20px; border-radius: 10px;
    font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none;
    transition: all .25s; z-index: 100; box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 项目编辑里的预算 */
  .proj-list-edit { display: flex; flex-direction: column; gap: 8px; }
  .proj-edit-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; }
  .proj-edit-item .em { font-size: 18px; }
  .proj-edit-item .nm { flex: 1; font-weight: 600; font-size: 13px; }
  .proj-edit-item .del { color: var(--text-3); width: 28px; height: 28px; border-radius: 7px; }
  .proj-edit-item .del:hover { color: var(--danger); background: #fef2f2; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: static; }
    .overview { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 520px) {
    .overview { grid-template-columns: 1fr; }
    .app { padding: 16px 12px 70px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- 顶栏 -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-logo">账</div>
      <div>
        <h1>记账本</h1>
        <div class="sub">简洁 · 实用 · 高级</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn btn-ghost" onclick="openManageProjects()">管理项目</button>
      <button class="btn btn-primary" onclick="openTxModal()">+ 记一笔</button>
    </div>
  </div>

  <!-- 概览 -->
  <div class="overview">
    <div class="card">
      <div class="stat-label">本月支出</div>
      <div class="stat-value income" id="ov-expense">¥0</div>
      <div class="stat-sub" id="ov-expense-sub">0 笔</div>
    </div>
    <div class="card">
      <div class="stat-label">本月收入</div>
      <div class="stat-value expense" id="ov-income">¥0</div>
      <div class="stat-sub" id="ov-income-sub">0 笔</div>
    </div>
    <div class="card">
      <div class="stat-label">本月结余</div>
      <div class="stat-value" id="ov-balance">¥0</div>
      <div class="stat-sub" id="ov-balance-sub">收入 − 支出</div>
    </div>
  </div>

  <!-- 模块切换 -->
  <div class="seg" id="modeSeg">
    <button class="active" data-mode="daily" onclick="switchMode('daily')">日常记账</button>
    <button data-mode="project" onclick="switchMode('project')">项目记账</button>
  </div>

  <!-- 主区域 -->
  <div class="layout">
    <div id="mainPanel">
      <!-- 由 JS 渲染 -->
    </div>
    <div class="side" id="sidePanel">
      <!-- 由 JS 渲染 -->
    </div>
  </div>
</div>

<!-- 记账弹窗 -->
<div class="modal-mask" id="txModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="txModalTitle">记一笔</h3>
      <button class="modal-close" onclick="closeModal('txModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="type-toggle">
        <button id="typeExp" class="on-exp" onclick="setType('expense')">支出</button>
        <button id="typeInc" onclick="setType('income')">收入</button>
      </div>
      <div class="field">
        <label>金额</label>
        <div class="amount-box"><span>¥</span><input type="number" id="fAmount" placeholder="0.00" step="0.01" min="0"></div>
      </div>
      <div class="field">
        <label>分类</label>
        <div class="cat-grid" id="catGrid"></div>
      </div>
      <div class="field" id="projField" style="display:none;">
        <label>所属项目</label>
        <select id="fProject"></select>
      </div>
      <div class="field">
        <label>备注</label>
        <input type="text" id="fNote" placeholder="选填，如：午饭 / 打车">
      </div>
      <div class="field">
        <label>日期</label>
        <input type="date" id="fDate">
      </div>
    </div>
    <div class="modal-foot" id="txFoot">
      <button class="btn btn-primary" onclick="saveTx()">保存</button>
    </div>
  </div>
</div>

<!-- 项目管理弹窗 -->
<div class="modal-mask" id="projModal">
  <div class="modal">
    <div class="modal-head">
      <h3>项目记账</h3>
      <button class="modal-close" onclick="closeModal('projModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>已有项目</label>
        <div class="proj-list-edit" id="projListEdit"></div>
      </div>
      <div class="field">
        <label>新增项目</label>
        <input type="text" id="newProjName" placeholder="项目名称，如：日本旅行" style="border:1px solid var(--border);border-radius:9px;padding:10px 12px;">
      </div>
      <div class="field">
        <label>项目图标</label>
        <div class="cat-grid" id="projIconGrid"></div>
      </div>
      <div class="field">
        <label>预算（可选）</label>
        <div class="amount-box"><span>¥</span><input type="number" id="newProjBudget" placeholder="0.00" step="0.01" min="0"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="confirmAddProject()" style="flex:1;justify-content:center;padding:11px;">确认添加</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 数据层 ============ */
const LS_KEY = 'ledger_data_v1';
const DEFAULT_CATS = {
  expense: [
    { name: '餐饮', emoji: '🍜', color: '#f97316' },
    { name: '交通', emoji: '🚗', color: '#3b82f6' },
    { name: '购物', emoji: '🛍️', color: '#ec4899' },
    { name: '居住', emoji: '🏠', color: '#8b5cf6' },
    { name: '娱乐', emoji: '🎮', color: '#06b6d4' },
    { name: '医疗', emoji: '💊', color: '#ef4444' },
    { name: '教育', emoji: '📚', color: '#14b8a6' },
    { name: '其他', emoji: '📦', color: '#64748b' },
  ],
  income: [
    { name: '工资', emoji: '💼', color: '#10b981' },
    { name: '奖金', emoji: '🎁', color: '#f59e0b' },
    { name: '理财', emoji: '📈', color: '#22c55e' },
    { name: '其他', emoji: '💰', color: '#84cc16' },
  ]
};
const PROJECT_PRESETS = [
  { name: '旅游', emoji: '✈️', color: '#3b82f6' },
  { name: 'AI 充值', emoji: '🤖', color: '#8b5cf6' },
  { name: '游戏', emoji: '🎮', color: '#06b6d4' },
  { name: '服装购买', emoji: '👔', color: '#ec4899' },
];

let db = load();

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { txs: [], projects: [] };
}
function persist() {
  localStorage.setItem(LS_KEY, JSON.stringify(db));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============ 状态 ============ */
let mode = 'daily';          // daily | project
let activeProject = null;    // 项目模式下选中的项目 id
let filterMonth = currentMonth(); // YYYY-MM
let filterKw = '';
let filterCat = 'all';

let txForm = { type: 'expense', cat: null, project: null, editing: null };
let newProjDraft = { name: '', emoji: '✈️', color: '#3b82f6', budget: '' };

function currentMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function monthLabel(ym) {
  const [y, m] = ym.split('-').map(Number);
  return `${y}年${m}月`;
}

function shiftMonth(delta) {
  const [y, m] = filterMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  filterMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}

/* ============ 工具 ============ */
function fmt(n) {
  return '¥' + (Number(n)||0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPlain(n) {
  return (Number(n)||0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function findCat(type, name) {
  return (DEFAULT_CATS[type] || []).find(c => c.name === name);
}
function findProject(id) { return db.projects.find(p => p.id === id); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ============ 模式切换 ============ */
function switchMode(m) {
  mode = m;
  activeProject = null;
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  render();
}

/* ============ 渲染 ============ */
function render() {
  renderOverview();
  if (mode === 'daily') renderDaily();
  else renderProject();
}

function renderOverview() {
  const [ym, m] = monthRange(filterMonth);
  const list = db.txs.filter(t => t.date >= ym && t.date <= m);
  const exp = list.filter(t => t.type === 'expense').reduce((s,t)=>s+Number(t.amount),0);
  const inc = list.filter(t => t.type === 'income').reduce((s,t)=>s+Number(t.amount),0);
  document.getElementById('ov-expense').textContent = fmt(exp);
  document.getElementById('ov-income').textContent = fmt(inc);
  document.getElementById('ov-balance').textContent = fmt(inc - exp);
  document.getElementById('ov-expense-sub').textContent = list.filter(t=>t.type==='expense').length + ' 笔';
  document.getElementById('ov-income-sub').textContent = list.filter(t=>t.type==='income').length + ' 笔';
  const bal = inc - exp;
  document.getElementById('ov-balance').style.color = bal >= 0 ? 'var(--expense)' : 'var(--income)';
  document.getElementById('ov-balance-sub').textContent = bal >= 0 ? '结余为正' : '已超支';
}

function monthRange(ym) {
  const start = ym + '-01';
  const [y, m] = ym.split('-').map(Number);
  const end = `${y}-${String(m).padStart(2,'0')}-31`;
  return [start, end];
}

function renderDaily() {
  const main = document.getElementById('mainPanel');
  const side = document.getElementById('sidePanel');

  const [start, end] = monthRange(filterMonth);
  let list = db.txs.filter(t => {
    const inMonth = t.date >= start && t.date <= end;
    const inCat = filterCat === 'all' || t.cat === filterCat;
    const inKw = !filterKw || (t.note||'').includes(filterKw) || (t.cat||'').includes(filterKw);
    return inMonth && inCat && inKw;
  }).sort((a,b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);

  // 主面板
  const allCats = [...DEFAULT_CATS.expense, ...DEFAULT_CATS.income];
  let html = `<div class="panel">
    <div class="panel-head"><h2>收支明细</h2><span class="count">共 ${list.length} 笔</span></div>
    <div class="filters">
      <div class="month-nav">
        <button onclick="shiftMonth(-1)" title="上个月">‹</button>
        <span class="month-label">${monthLabel(filterMonth)}</span>
        <button onclick="shiftMonth(1)" title="下个月">›</button>
      </div>
      <select onchange="filterCat=this.value;render();">
        <option value="all" ${filterCat==='all'?'selected':''}>全部分类</option>
        ${allCats.map(c=>`<option value="${c.name}" ${filterCat===c.name?'selected':''}>${c.emoji} ${c.name}</option>`).join('')}
      </select>
      <input class="kw" placeholder="搜索备注 / 分类" value="${filterKw}" oninput="filterKw=this.value;render();">
    </div>
    <div class="tx-list">${renderTxList(list)}</div>
  </div>`;
  main.innerHTML = html;

  // 侧栏 - 分类统计
  const expList = db.txs.filter(t => t.type==='expense' && t.date>=start && t.date<=end);
  const totalExp = expList.reduce((s,t)=>s+Number(t.amount),0);
  const byCat = {};
  expList.forEach(t => { byCat[t.cat] = (byCat[t.cat]||0) + Number(t.amount); });
  const entries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxV = entries.length ? entries[0][1] : 1;

  side.innerHTML = `
    <div class="card">
      <div class="stat-label" style="margin-bottom:14px;">本月支出构成</div>
      <div class="cat-stat">
        ${entries.length ? entries.map(([name,v]) => {
          const c = findCat('expense', name) || { emoji:'📦', color:'#64748b' };
          const pct = totalExp ? (v/totalExp*100) : 0;
          return `<div class="cat-row">
            <span class="ic" style="background:${c.color}18;">${c.emoji}</span>
            <span class="nm">${name}</span>
            <div class="bar"><div class="f" style="width:${pct}%;background:${c.color};"></div></div>
            <span class="val">${fmtPlain(v)}</span>
          </div>`;
        }).join('') : `<div class="empty" style="padding:30px;"><p>本月暂无支出</p></div>`}
      </div>
    </div>
    <div class="card">
      <div class="stat-label">提示</div>
      <p style="font-size:12.5px;color:var(--text-2);line-height:1.7;">
        点击任意一笔可编辑或删除。<br>
        顶部「+ 记一笔」快速添加。<br>
        涉及特定主题（旅游、游戏等）的支出，建议用「项目记账」分类管理。
      </p>
    </div>`;
}

function renderTxList(list) {
  if (!list.length) {
    return `<div class="empty"><div class="icon">📭</div><p>暂无记录，点击右上角「记一笔」开始</p></div>`;
  }
  const groups = {};
  list.forEach(t => {
    (groups[t.date] = groups[t.date] || []).push(t);
  });
  const dates = Object.keys(groups).sort().reverse();
  return dates.map(d => {
    const items = groups[d];
    const dayExp = items.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
    const dayInc = items.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
    const dt = new Date(d + 'T00:00:00');
    const label = `${dt.getMonth()+1}月${dt.getDate()}日`;
    return `<div class="tx-group">
      <div class="tx-date">${label}<span class="day-total">${dayExp ? '支 '+fmtPlain(dayExp) : ''}${dayInc ? ' · 收 '+fmtPlain(dayInc) : ''}</span></div>
      ${items.map(t => {
        const c = findCat(t.type, t.cat) || { emoji:'📦', color:'#64748b' };
        const p = t.project ? findProject(t.project) : null;
        return `<div class="tx-item" onclick="openTxModal('${t.id}')">
          <button class="tx-del" title="删除" onclick="event.stopPropagation();deleteTx('${t.id}')">✕</button>
          <div class="tx-icon" style="background:${c.color}18;">${c.emoji}</div>
          <div class="tx-main">
            <div class="tx-title">${escapeHtml(t.note || t.cat || '未命名')}
              ${p ? `<span class="tx-cat-tag tx-proj-tag">${p.emoji} ${p.name}</span>` : `<span class="tx-cat-tag">${t.cat}</span>`}
            </div>
            <div class="tx-meta">${t.date}</div>
          </div>
          <div class="tx-amount ${t.type}">${t.type==='expense'?'-':'+'}${fmtPlain(t.amount)}</div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

function renderProject() {
  const main = document.getElementById('mainPanel');
  const side = document.getElementById('sidePanel');

  if (activeProject) {
    const p = findProject(activeProject);
    if (!p) { activeProject = null; renderProject(); return; }
    const list = db.txs.filter(t => t.project === p.id).sort((a,b)=>b.date.localeCompare(a.date) || b.createdAt-a.createdAt);
    const spent = list.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
    const budget = Number(p.budget) || 0;
    const pct = budget ? Math.min(spent/budget*100, 100) : 0;

    main.innerHTML = `<div class="panel">
      <div class="panel-head">
        <h2 style="display:flex;align-items:center;gap:8px;"><span>${p.emoji}</span> ${p.name}</h2>
        <button class="btn" style="padding:6px 12px;font-size:12.5px;" onclick="activeProject=null;render();">← 返回项目</button>
      </div>
      <div class="card" style="border:none;border-radius:0;border-bottom:1px solid var(--border);box-shadow:none;">
        <div class="proj-stats" style="font-size:13px;">
          <span>总支出 <b class="spend">${fmtPlain(spent)}</b></span>
          ${budget ? `<span>预算 <b>${fmtPlain(budget)}</b></span><span>已用 <b>${(pct).toFixed(0)}%</b></span>` : `<span>未设预算</span>`}
        </div>
        ${budget ? `<div class="proj-bar" style="margin-top:10px;"><div class="fill" style="width:${pct}%;background:${pct>=100?'#ef4444':'linear-gradient(90deg,#2563eb,#4f46e5)'};"></div></div>` : ''}
      </div>
      <div class="tx-list">${renderTxList(list)}</div>
    </div>`;

    side.innerHTML = `
      <div class="card">
        <div class="stat-label">操作</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button class="btn btn-primary" style="justify-content:center;" onclick="openTxModal(null,'${p.id}')">+ 记一笔</button>
          <button class="btn" style="justify-content:center;" onclick="editProject('${p.id}')">编辑项目</button>
          <button class="btn btn-danger" style="justify-content:center;" onclick="deleteProject('${p.id}')">删除项目</button>
        </div>
      </div>
      <div class="card">
        <div class="stat-label">统计</div>
        <div class="cat-stat">
          <div class="cat-row"><span class="ic" style="background:#e11d4818;">📉</span><span class="nm">总支出</span><span class="val">${fmtPlain(spent)}</span></div>
          <div class="cat-row"><span class="ic" style="background:#05966918;">📊</span><span class="nm">笔数</span><span class="val">${list.length} 笔</span></div>
          ${budget ? `<div class="cat-row"><span class="ic" style="background:#f59e0b18;">🎯</span><span class="nm">剩余预算</span><span class="val" style="color:${spent>budget?'var(--danger)':'inherit'}">${fmtPlain(budget-spent)}</span></div>` : ''}
        </div>
      </div>`;
    return;
  }

  // 项目列表
  const projects = db.projects;
  const grid = projects.length ? projects.map(p => {
    const list = db.txs.filter(t => t.project === p.id);
    const spent = list.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
    const budget = Number(p.budget) || 0;
    const pct = budget ? Math.min(spent/budget*100, 100) : 0;
    return `<div class="proj-card" onclick="activeProject='${p.id}';render();">
      <button class="proj-del" title="删除项目" onclick="event.stopPropagation();deleteProject('${p.id}')">✕</button>
      <div class="proj-top">
        <div class="proj-icon" style="background:${p.color}18;">${p.emoji}</div>
        <div>
          <div class="proj-name">${escapeHtml(p.name)}</div>
          <div class="proj-desc">${list.length} 笔记录</div>
        </div>
      </div>
      <div class="proj-stats">
        <span>支出 <b class="spend">${fmtPlain(spent)}</b></span>
        ${budget ? `<span>预算 <b>${fmtPlain(budget)}</b></span>` : '<span></span>'}
      </div>
      ${budget ? `<div class="proj-bar"><div class="fill" style="width:${pct}%;"></div></div>` : ''}
    </div>`;
  }).join('') : `<div class="empty"><div class="icon">🗂️</div><p>还没有项目，点击右上角「管理项目」创建</p></div>`;

  main.innerHTML = `<div>
    <div class="panel-head" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;">
      <h2>我的项目</h2>
      <button class="btn btn-primary" style="padding:6px 14px;font-size:12.5px;" onclick="openManageProjects()">+ 新建项目</button>
    </div>
    <div class="proj-grid">${grid}</div>
  </div>`;

  const totalSpent = db.projects.reduce((s,p) => {
    const list = db.txs.filter(t=>t.project===p.id && t.type==='expense');
    return s + list.reduce((x,t)=>x+Number(t.amount),0);
  }, 0);

  side.innerHTML = `
    <div class="card">
      <div class="stat-label" style="margin-bottom:14px;">项目总览</div>
      <div class="cat-stat">
        ${db.projects.length ? db.projects.map(p => {
          const list = db.txs.filter(t=>t.project===p.id && t.type==='expense');
          const v = list.reduce((s,t)=>s+Number(t.amount),0);
          const pct = totalSpent ? v/totalSpent*100 : 0;
          return `<div class="cat-row">
            <span class="ic" style="background:${p.color}18;">${p.emoji}</span>
            <span class="nm">${escapeHtml(p.name)}</span>
            <div class="bar"><div class="f" style="width:${pct}%;background:${p.color};"></div></div>
            <span class="val">${fmtPlain(v)}</span>
          </div>`;
        }).join('') : `<div class="empty" style="padding:30px;"><p>暂无项目</p></div>`}
      </div>
      ${totalSpent ? `<div class="proj-stats" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);"><span>项目总支出</span><b class="spend">${fmtPlain(totalSpent)}</b></div>` : ''}
    </div>`;
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ 记账弹窗 ============ */
function openTxModal(txId, presetProject) {
  const modal = document.getElementById('txModal');
  txForm = { type: 'expense', cat: null, project: presetProject || null, editing: txId || null };

  if (txId) {
    const t = db.txs.find(x => x.id === txId);
    if (!t) return;
    txForm.type = t.type;
    txForm.cat = t.cat;
    txForm.project = t.project || null;
    txForm.editing = t.id;
    document.getElementById('fAmount').value = t.amount;
    document.getElementById('fNote').value = t.note || '';
    document.getElementById('fDate').value = t.date;
    document.getElementById('txModalTitle').textContent = '编辑记录';
    document.getElementById('txFoot').innerHTML = `
      <button class="btn btn-danger" onclick="deleteTx('${t.id}')">删除</button>
      <button class="btn btn-primary" onclick="saveTx()">保存</button>`;
  } else {
    document.getElementById('fAmount').value = '';
    document.getElementById('fNote').value = '';
    document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
    document.getElementById('txModalTitle').textContent = '记一笔';
    document.getElementById('txFoot').innerHTML = `<button class="btn btn-primary" onclick="saveTx()">保存</button>`;
  }

  document.getElementById('fProject').value = txForm.project || '';
  renderCatGrid();
  renderProjectSelect();
  applyType();
  modal.classList.add('show');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

function setType(type) {
  txForm.type = type;
  txForm.cat = null;
  applyType();
  renderCatGrid();
}

function applyType() {
  document.getElementById('typeExp').className = txForm.type === 'expense' ? 'on-exp' : '';
  document.getElementById('typeInc').className = txForm.type === 'income' ? 'on-inc' : '';
  const pf = document.getElementById('projField');
  // 收入一般不关联项目
  pf.style.display = txForm.type === 'expense' ? 'flex' : 'none';
}

function renderCatGrid() {
  const cats = DEFAULT_CATS[txForm.type];
  const grid = document.getElementById('catGrid');
  grid.innerHTML = cats.map(c => `
    <button class="cat-opt ${txForm.cat===c.name?'sel':''}" onclick="txForm.cat='${c.name}';renderCatGrid();">
      <span class="em">${c.emoji}</span>${c.name}
    </button>`).join('');
}

function renderProjectSelect() {
  const sel = document.getElementById('fProject');
  sel.innerHTML = `<option value="">不关联项目</option>` +
    db.projects.map(p => `<option value="${p.id}" ${txForm.project===p.id?'selected':''}>${p.emoji} ${p.name}</option>`).join('');
}

function saveTx() {
  const amount = parseFloat(document.getElementById('fAmount').value);
  if (!amount || amount <= 0) { toast('请输入有效金额'); return; }
  if (!txForm.cat) { toast('请选择分类'); return; }
  const note = document.getElementById('fNote').value.trim();
  const date = document.getElementById('fDate').value;
  if (!date) { toast('请选择日期'); return; }
  const project = txForm.type === 'expense' ? (document.getElementById('fProject').value || null) : null;

  if (txForm.editing) {
    const t = db.txs.find(x => x.id === txForm.editing);
    if (t) Object.assign(t, { amount, cat: txForm.cat, note, date, project, type: txForm.type });
    toast('已更新');
  } else {
    db.txs.push({ id: uid(), type: txForm.type, amount, cat: txForm.cat, note, date, project, createdAt: Date.now() });
    toast('已记录');
  }
  persist();
  closeModal('txModal');
  render();
}

function deleteTx(id) {
  if (!confirm('确定删除这条记录吗？')) return;
  db.txs = db.txs.filter(t => t.id !== id);
  persist();
  closeModal('txModal');
  render();
  toast('已删除');
}

/* ============ 项目管理 ============ */
function openManageProjects() {
  newProjDraft = { name: '', emoji: '✈️', color: '#3b82f6', budget: '' };
  document.getElementById('newProjName').value = '';
  document.getElementById('newProjBudget').value = '';
  renderProjListEdit();
  renderProjIconGrid();
  document.getElementById('projModal').classList.add('show');
}

function renderProjListEdit() {
  const box = document.getElementById('projListEdit');
  box.innerHTML = db.projects.length ? db.projects.map(p => `
    <div class="proj-edit-item">
      <span class="em">${p.emoji}</span>
      <span class="nm">${escapeHtml(p.name)}</span>
      <button class="del" onclick="deleteProject('${p.id}')" title="删除">✕</button>
    </div>`).join('') : `<div style="font-size:13px;color:var(--text-3);padding:6px 0;">暂无项目</div>`;
}

function renderProjIconGrid() {
  const grid = document.getElementById('projIconGrid');
  grid.innerHTML = PROJECT_PRESETS.map(p => `
    <button class="cat-opt ${newProjDraft.emoji===p.emoji?'sel':''}" onclick="newProjDraft.emoji='${p.emoji}';newProjDraft.color='${p.color}';renderProjIconGrid();">
      <span class="em">${p.emoji}</span>${p.name}
    </button>`).join('');
}

function addProject() {
  const name = document.getElementById('newProjName').value.trim();
  if (!name) { toast('请输入项目名称'); return false; }
  db.projects.push({
    id: uid(), name, emoji: newProjDraft.emoji, color: newProjDraft.color,
    budget: document.getElementById('newProjBudget').value || ''
  });
  persist();
  renderProjListEdit();
  document.getElementById('newProjName').value = '';
  document.getElementById('newProjBudget').value = '';
  toast('已添加项目');
  return true;
}

function confirmAddProject() {
  // 添加成功后关闭弹窗，切换到项目模式并显示项目列表
  if (addProject()) {
    closeModal('projModal');
    mode = 'project';
    activeProject = null;
    document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('active', b.dataset.mode === 'project'));
    renderProject();
  }
}

function editProject(id) {
  const p = findProject(id);
  if (!p) return;
  const name = prompt('项目名称', p.name);
  if (name === null) return;
  const budget = prompt('预算金额（留空表示不设预算）', p.budget || '');
  if (budget === null) return;
  p.name = name.trim() || p.name;
  p.budget = budget.trim();
  persist();
  render();
  toast('已更新项目');
}

function deleteProject(id) {
  const p = findProject(id);
  if (!p) return;
  if (!confirm(`确定删除项目「${p.name}」吗？\n项目下的账目记录会保留（不再关联项目）。`)) return;
  db.txs.forEach(t => { if (t.project === id) t.project = null; });
  db.projects = db.projects.filter(x => x.id !== id);
  persist();
  if (activeProject === id) activeProject = null;
  renderProjListEdit();
  render();
  toast('已删除项目');
}

/* ============ 关闭弹窗（点击遮罩） ============ */
document.querySelectorAll('.modal-mask').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
});

/* ============ 初始化 ============ */
render();
</script>
</body>
</html>
